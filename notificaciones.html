<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones - Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #121212; }
    .nav-link#facultadNav { color: #ffc107 !important; font-weight: bold; }
    .auth-vacia { visibility: hidden; }
    .search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #252525; z-index: 1050; border-radius: 0 0 10px 10px;
      max-height: 250px; overflow-y: auto; border: 1px solid #333;
    }
    .card-notif { 
        border-radius: 12px; 
        background-color: #1e1e1e; 
        transition: 0.3s; 
        border: 1px solid #333;
        cursor: pointer;
    }
    .card-notif.no-leida { 
        border-left: 4px solid #0d6efd; 
        background-color: #252525;
    }
    .card-notif:hover { background-color: #2a2a2a; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="inicioRed.html">
      <img src="images/logoUNAM.png" width="40" class="me-2">
      <strong class="d-none d-sm-block">Red UNAM</strong>
    </a>

    <div class="flex-grow-1 mx-3 position-relative" style="max-width: 400px;">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-dark border-0 text-white"><i class="bi bi-search"></i></span>
        <input type="text" id="inputBusqueda" class="form-control bg-dark border-0 text-white" placeholder="Buscar en la UNAM...">
      </div>
      <div id="resultadosBusqueda" class="search-results shadow"></div>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="inicioRed.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="amigos.html"><i class="bi bi-people-fill"></i></a></li>
        <li class="nav-item">
          <a class="nav-link active position-relative" href="notificaciones.html">
            <i class="bi bi-bell-fill"></i>
            <span id="badge-notificaciones" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
          </a>
        </li>
        <li class="nav-item"><a class="nav-link auth-vacia" href="facultad.html" id="facultadNav"></a></li>
      </ul>
      <div id="authArea" class="auth-vacia"></div>
    </div>
  </div>
</nav>

<div class="container mt-4" style="max-width: 750px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0 text-white fw-bold"><i class="bi bi-bell me-2"></i>Notificaciones</h4>
    <button id="btnMarcarTodo" class="btn btn-outline-secondary btn-sm rounded-pill">
        Marcar todas como leídas
    </button>
  </div>

  <div id="contenedorNotificaciones">
    <div class="text-center p-5"><div class="spinner-border text-primary"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  (function() {
    const sesion = JSON.parse(localStorage.getItem("sesion"));

    // --- 🛠 LÓGICA DE INSTITUCIÓN ---
    function obtenerInstitucion(email) {
        if (!email) return "Comunidad UNAM";
        if (email.endsWith('@aragon.unam.mx')) return "FES Aragón";
        if (email.endsWith('@ingenieria.unam.mx')) return "Facultad de Ingeniería";
        if (email.endsWith('@comunidad.unam.mx')) return "UNAM Central";
        return "Comunidad UNAM";
    }

    window.irANotificacion = async (id, postId, emisorId) => {
        await window.supabaseClient.from('notificaciones').update({ leida: true }).eq('id', id);
        if (postId && postId !== "null" && postId !== "") {
            window.location.href = `inicioRed.html?post=${postId}`;
        } else if (emisorId && emisorId !== "null") {
            window.location.href = `perfil.html?id=${emisorId}`;
        } else {
            window.location.href = `inicioRed.html`;
        }
    };

    async function cargarNotificacionesFull() {
        const contenedor = document.getElementById("contenedorNotificaciones");
        const badgeNav = document.getElementById("badge-notificaciones");
        
        const { data: notifs, error } = await window.supabaseClient
            .from('notificaciones')
            .select('*')
            .eq('usuario_id', sesion.id)
            .order('creado_a_las', { ascending: false });

        if (error) return;

        const noLeidas = notifs?.filter(n => !n.leida).length || 0;
        badgeNav.innerText = noLeidas;
        noLeidas > 0 ? badgeNav.classList.remove("d-none") : badgeNav.classList.add("d-none");

        if (!notifs || notifs.length === 0) {
            contenedor.innerHTML = '<div class="card card-notif p-5 text-center text-muted">No hay actividad nueva.</div>';
            return;
        }

        contenedor.innerHTML = notifs.map(n => {
            const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(n.emisor_nombre)}&background=random`;
            return `
                <div class="card card-notif mb-3 p-3 ${n.leida ? '' : 'no-leida'}" 
                     onclick="irANotificacion('${n.id}', '${n.post_id || ''}', '${n.emisor_id || ''}')">
                    <div class="d-flex align-items-center">
                        <img src="${avatar}" class="rounded-circle me-3" width="50">
                        <div class="flex-grow-1">
                            <p class="mb-0 text-white">
                                <span class="fw-bold">${n.emisor_nombre}</span> ${n.tipo}
                            </p>
                            <small class="text-muted" style="font-size: 0.75rem;">${new Date(n.creado_a_las).toLocaleString()}</small>
                        </div>
                        ${!n.leida ? '<span class="badge bg-primary rounded-pill">Nueva</span>' : ''}
                    </div>
                </div>`;
        }).join('');
    }

    function configurarInterfaz() {
      if (!sesion) { window.location.replace("index.html"); return; }
      
      const miInst = obtenerInstitucion(sesion.email);
      const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff`;
      
      // Botón Facultad Nav
      const fNav = document.getElementById("facultadNav");
      fNav.innerHTML = `🎓 ${miInst}`;
      fNav.classList.remove("auth-vacia");

      // Dropdown de Usuario con Institución
      const authArea = document.getElementById("authArea");
      authArea.innerHTML = `
        <div class="dropdown">
          <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
            ${sesion.nombre.split(' ')[0]}
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow p-3">
            <li class="text-center mb-2">
              <img src="${avatar}" class="rounded-circle mb-2" width="55">
              <div class="fw-bold text-primary small">${sesion.nombre}</div>
              <div class="text-muted" style="font-size: 0.7rem;">${miInst}</div>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-center fw-bold border rounded mb-2" href="perfil.html">Ver Perfil</a></li>
            <li><button class="dropdown-item text-danger text-center fw-bold" id="logoutBtn">Cerrar sesión</button></li>
          </ul>
        </div>`;
      authArea.classList.remove("auth-vacia");

      document.getElementById("logoutBtn").onclick = () => {
        localStorage.removeItem("sesion");
        window.location.replace("index.html");
      };

      cargarNotificacionesFull();
    }

    // Buscador
    document.getElementById('inputBusqueda').addEventListener('input', async (e) => {
        const q = e.target.value.trim();
        const res = document.getElementById('resultadosBusqueda');
        if (q.length < 2) { res.innerHTML = ""; return; }
        const { data } = await window.supabaseClient.from('usuarios').select('id, nombre').ilike('nombre', `%${q}%`).limit(5);
        res.innerHTML = data.map(u => `<div class="p-2 border-bottom border-secondary text-white small cursor-pointer" onclick="location.href='perfil.html?id=${u.id}'">${u.nombre}</div>`).join('');
    });

    document.getElementById("btnMarcarTodo").onclick = async () => {
        await window.supabaseClient.from('notificaciones').update({ leida: true }).eq('usuario_id', sesion.id);
        cargarNotificacionesFull();
    };

    configurarInterfaz();
  })();
</script>
</body>
</html>
