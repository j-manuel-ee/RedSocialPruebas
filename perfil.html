<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Red UNAM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #121212; }
    .nav-link#facultadNav { color: #ffc107 !important; font-weight: bold; }
    .auth-vacia { visibility: hidden; }
    .search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #252525; z-index: 1050; border-radius: 0 0 10px 10px;
      max-height: 250px; overflow-y: auto; border: 1px solid #333;
    }
    /* Perfil */
    .perfil-header { background-color: #1e1e1e; border-radius: 0 0 20px 20px; overflow: hidden; border-bottom: 1px solid #333; }
    .portada-color { height: 200px; background: linear-gradient(45deg, #002b5c, #0d6efd); width: 100%; }
    .foto-perfil-contenedor { margin-top: -60px; padding-left: 30px; }
    .foto-perfil { width: 130px; height: 130px; border: 4px solid #1e1e1e; object-fit: cover; background: #252525; }
    .btn-edit-foto { position: absolute; bottom: 5px; right: 5px; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
    .card-social { border-radius: 12px; background-color: #1e1e1e; border: 1px solid #333; margin-bottom: 20px; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="inicioRed.html">
      <img src="images/logoUNAM.png" width="40" class="me-2">
      <strong class="d-none d-sm-block">Red UNAM</strong>
    </a>

    <div class="flex-grow-1 mx-3 position-relative" style="max-width: 400px;">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-dark border-0 text-white"><i class="bi bi-search"></i></span>
        <input type="text" id="inputBusqueda" class="form-control bg-dark border-0 text-white" placeholder="Buscar en la UNAM...">
      </div>
      <div id="resultadosBusqueda" class="search-results shadow"></div>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="inicioRed.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link position-relative" href="notificaciones.html">
            <i class="bi bi-bell-fill"></i>
            <span id="badge-notificaciones" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
        </a></li>
        <li class="nav-item"><a class="nav-link auth-vacia" href="facultad.html" id="facultadNav"></a></li>
      </ul>
      <div id="authArea" class="auth-vacia"></div>
    </div>
  </div>
</nav>

<div class="container mt-0 mt-md-4 mb-5">
  <div class="perfil-header shadow-sm mb-4">
    <div class="portada-color"></div>
    <div class="d-flex align-items-end foto-perfil-contenedor position-relative">
      <div class="position-relative">
        <img src="" id="imgPerfil" class="foto-perfil rounded-circle">
        <label for="inputFoto" class="btn btn-primary btn-edit-foto d-none" id="labelFoto">
          <i class="bi bi-camera-fill"></i>
        </label>
        <input type="file" id="inputFoto" hidden accept="image/*">
      </div>
      <div class="ms-3 mb-2">
        <h3 class="fw-bold mb-0 text-white" id="nombreDisplay">...</h3>
        <p class="text-muted small mb-0" id="cuentaDisplay">Cuenta: ---</p>
      </div>
      <div id="areaAcciones" class="ms-auto me-4 mb-3"></div>
    </div>
    <div class="px-4 py-3">
        <p class="text-white mb-0" id="descripcionDisplay">Cargando...</p>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-4">
      <div class="card card-social p-3 shadow-sm">
        <h6 class="text-muted text-uppercase small fw-bold mb-3">Detalles Académicos</h6>
        <div class="text-white small">
            <p><i class="bi bi-envelope me-2 text-primary"></i> <span id="emailDisplay">...</span></p>
            <p><i class="bi bi-mortarboard me-2 text-warning"></i> <span id="institucionDisplay">...</span></p>
            <p><i class="bi bi-shield-check me-2 text-success"></i> Estado: <span id="estadoDisplay">...</span></p>
            <p><i class="bi bi-eye me-2 text-info"></i> Perfil: <span id="privacidadDisplay">...</span></p>
        </div>
        <button class="btn btn-outline-primary btn-sm w-100 mt-2 d-none" id="btnAbrirModal" data-bs-toggle="modal" data-bs-target="#modalEditar">Editar Perfil</button>
      </div>
    </div>
    <div class="col-lg-8">
      <h6 class="text-muted text-uppercase small fw-bold mb-3">Publicaciones</h6>
      <div id="feedUsuario"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-white border-secondary">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Editar Perfil</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small text-muted">Descripción</label>
          <textarea id="editDescripcion" class="form-control bg-transparent text-white border-secondary" rows="4"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label small text-muted">Privacidad</label>
          <select id="editPrivacidad" class="form-select bg-transparent text-white border-secondary">
              <option value="Público">Público</option>
              <option value="Privado">Privado</option>
          </select>
        </div>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-primary w-100 fw-bold" id="btnGuardar">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  (function() {
    const sesion = JSON.parse(localStorage.getItem("sesion"));
    const urlParams = new URLSearchParams(window.location.search);
    const perfilId = urlParams.get('id') || sesion?.id;

    // --- 🛠 LÓGICA DE INSTITUCIÓN POR CORREO ---
    function obtenerInstitucion(email) {
        if (!email) return "Comunidad UNAM";
        if (email.endsWith('@aragon.unam.mx')) return "FES Aragón";
        if (email.endsWith('@ingenieria.unam.mx')) return "Facultad de Ingeniería";
        if (email.endsWith('@comunidad.unam.mx')) return "UNAM Central";
        return "Comunidad UNAM";
    }

    async function inicializar() {
      if (!sesion) { window.location.replace("index.html"); return; }

      // 1. Obtener datos del perfil que estamos viendo
      const { data: user } = await window.supabaseClient.from('usuarios').select('*').eq('id', perfilId).single();
      if (!user) return;

      // 2. Configurar Navbar basado en la sesión del usuario logueado
      configurarNavbar(sesion);
      
      // 3. Renderizar el Perfil
      const instPerfil = obtenerInstitucion(user.email);
      document.getElementById("nombreDisplay").innerText = user.nombre;
      document.getElementById("cuentaDisplay").innerText = `Cuenta: ${user.numero_cuenta}`;
      document.getElementById("emailDisplay").innerText = user.email;
      document.getElementById("institucionDisplay").innerText = instPerfil;
      document.getElementById("descripcionDisplay").innerText = user.descripcion || "Sin descripción.";
      document.getElementById("estadoDisplay").innerText = user.estado;
      document.getElementById("privacidadDisplay").innerText = user.privacidad;
      
      const avatarDefault = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.nombre)}&background=random`;
      document.getElementById("imgPerfil").src = user.foto_perfil || avatarDefault;

      if (perfilId === sesion.id) {
        document.getElementById("labelFoto").classList.remove("d-none");
        document.getElementById("btnAbrirModal").classList.remove("d-none");
        document.getElementById("areaAcciones").innerHTML = `<button class="btn btn-outline-light btn-sm rounded-pill fw-bold px-4" data-bs-toggle="modal" data-bs-target="#modalEditar">Configurar Perfil</button>`;
        document.getElementById("editDescripcion").value = user.descripcion || "";
        document.getElementById("editPrivacidad").value = user.privacidad;
      } else {
        document.getElementById("areaAcciones").innerHTML = `<button class="btn btn-primary btn-sm rounded-pill fw-bold px-4" onclick="enviarSolicitud('${user.id}')">Seguir</button>`;
      }

      cargarPosts(user.id, user.nombre);
    }

    function configurarNavbar(s) {
      const miInst = obtenerInstitucion(s.email);
      
      // Botón Facultad Nav
      const fNav = document.getElementById("facultadNav");
      fNav.innerHTML = `🎓 ${miInst}`;
      fNav.classList.remove("auth-vacia");

      // Dropdown Usuario
      const avatarNav = `https://ui-avatars.com/api/?name=${encodeURIComponent(s.nombre)}&background=0D6EFD&color=fff`;
      document.getElementById("authArea").innerHTML = `
        <div class="dropdown">
          <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
            ${s.nombre.split(' ')[0]}
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow p-3">
            <li class="text-center mb-2">
              <img src="${avatarNav}" class="rounded-circle mb-2" width="55">
              <div class="fw-bold text-primary small">${s.nombre}</div>
              <div class="text-muted" style="font-size: 0.7rem;">${miInst}</div>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-center fw-bold border rounded mb-2" href="perfil.html">Ver Perfil</a></li>
            <li><button class="dropdown-item text-danger text-center fw-bold" onclick="localStorage.removeItem('sesion'); location.href='index.html'">Cerrar sesión</button></li>
          </ul>
        </div>`;
      document.getElementById("authArea").classList.remove("auth-vacia");

      // Buscador
      document.getElementById('inputBusqueda').addEventListener('input', async (e) => {
          const q = e.target.value.trim();
          const res = document.getElementById('resultadosBusqueda');
          if (q.length < 2) { res.innerHTML = ""; return; }
          const { data } = await window.supabaseClient.from('usuarios').select('id, nombre').ilike('nombre', `%${q}%`).limit(5);
          res.innerHTML = data.map(u => `<div class="p-2 border-bottom border-secondary text-white small cursor-pointer" onclick="location.href='perfil.html?id=${u.id}'">${u.nombre}</div>`).join('');
      });
    }

    // Funciones de carga de posts y notificaciones... (omitidas por brevedad pero deben estar en tu código final)
    async function cargarPosts(uid, nombre) {
      const { data: posts } = await window.supabaseClient.from('publicaciones').select('*').eq('autor_id', uid).order('creado_a_las', { ascending: false });
      const feed = document.getElementById("feedUsuario");
      feed.innerHTML = posts?.length ? posts.map(p => `
        <div class="card card-social p-3">
          <div class="d-flex align-items-center mb-2">
              <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(nombre)}&background=random" class="rounded-circle me-2" width="30">
              <small class="text-white fw-bold">${nombre}</small>
          </div>
          <p class="text-white mb-2">${p.contenido_texto || ''}</p>
          ${p.archivo_url ? `<img src="${p.archivo_url}" class="rounded w-100">` : ''}
        </div>`).join('') : '<p class="text-muted text-center p-4">Sin actividad.</p>';
    }

    document.getElementById("btnGuardar").onclick = async () => {
        const desc = document.getElementById("editDescripcion").value;
        const priv = document.getElementById("editPrivacidad").value;
        await window.supabaseClient.from('usuarios').update({ descripcion: desc, privacidad: priv }).eq('id', sesion.id);
        location.reload();
    };

    inicializar();
  })();
</script>
</body>
</html>
