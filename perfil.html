<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil — Red UNAM</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #181c24;
      --border: rgba(255,255,255,0.07);
      --accent: #002f6c;
      --gold: #c8a951;
      --text: #e8eaf0;
      --muted: #6b7280;
      --radius: 14px;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image: radial-gradient(circle at top right, rgba(0,47,108,0.15), transparent 40%);
    }

    /* Header & Navigation */
    .nav-custom {
      background: rgba(10,12,16,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 1000;
    }

    /* Profile Header */
    .profile-banner {
      height: 220px;
      background: linear-gradient(135deg, var(--accent), #001a3d);
      border-radius: 0 0 24px 24px;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      margin-top: -75px;
      display: inline-block;
    }

    .avatar-profile {
      width: 150px; height: 150px;
      border-radius: 50%;
      border: 5px solid var(--bg);
      object-fit: cover;
      background: var(--surface2);
    }

    .btn-edit-photo {
      position: absolute; bottom: 5px; right: 5px;
      background: var(--gold); color: #000;
      border-radius: 50%; width: 36px; height: 36px;
      display: grid; place-items: center; cursor: pointer;
      border: 3px solid var(--bg); transition: 0.2s;
    }
    .btn-edit-photo:hover { transform: scale(1.1); }

    /* Content Cards */
    .card-profile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      height: 100%;
    }

    .stat-box { text-align: center; padding: 10px; }
    .stat-value { font-family: 'DM Serif Display', serif; color: var(--gold); font-size: 1.5rem; display: block; }
    .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

    .post-card {
      background: var(--surface2);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 3px solid var(--accent);
    }

    /* Modal Styling */
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--gold);
      border-radius: 20px;
    }
    .form-control {
      background: var(--bg);
      border: 1px solid var(--border);
      color: white;
    }
    .form-control:focus { background: var(--bg); color: white; border-color: var(--gold); box-shadow: none; }
  </style>
</head>
<body>

<nav class="nav-custom py-2">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="inicioRed.html" class="text-decoration-none d-flex align-items-center gap-2">
      <div style="background: var(--gold); color:black; width:30px; height:30px; border-radius:6px; display:grid; place-items:center; font-weight:bold">U</div>
      <span class="fw-bold text-white small" style="letter-spacing:1px">RED UNAM</span>
    </a>
    <div class="d-flex align-items-center gap-3">
        <a href="inicioRed.html" class="btn btn-sm btn-outline-light border-0"><i class="bi bi-house"></i></a>
        <button onclick="logout()" class="btn btn-sm btn-danger px-3 rounded-pill" style="font-size: 11px;">SALIR</button>
    </div>
  </div>
</nav>

<div class="container mb-5">
  <div class="profile-banner shadow-lg"></div>
  
  <div class="text-center">
    <div class="avatar-wrapper">
      <img id="avatar-grande" src="" class="avatar-profile shadow-lg">
      <label for="upload-photo" class="btn-edit-photo">
        <i class="bi bi-camera-fill"></i>
        <input type="file" id="upload-photo" hidden accept="image/*">
      </label>
    </div>
    <h2 id="perfil-nombre" class="mt-3 fw-bold mb-0">Cargando...</h2>
    <p id="perfil-correo" class="text-gold mb-2" style="color: var(--gold); font-size: 0.9rem;"></p>
    
    <div class="d-flex justify-content-center gap-4 my-3">
        <div class="stat-box">
            <span id="count-posts" class="stat-value">0</span>
            <span class="stat-label">Publicaciones</span>
        </div>
        <div class="stat-box">
            <span id="count-friends" class="stat-value">0</span>
            <span class="stat-label">Amigos</span>
        </div>
    </div>

    <button class="btn btn-outline-light btn-sm rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#editModal">
        <i class="bi bi-pencil-square me-2"></i>Editar Perfil
    </button>
  </div>

  <div class="row mt-5 g-4">
    <div class="col-lg-4">
      <div class="card-profile">
        <h6 class="text-uppercase small fw-bold mb-3" style="letter-spacing: 2px;">Biografía</h6>
        <p id="perfil-bio" class="small text-muted" style="line-height: 1.6;">No has agregado una descripción aún.</p>
        <hr class="opacity-10">
        <div class="mb-3">
            <label class="d-block text-muted small mb-1">Privacidad</label>
            <span id="perfil-privacidad" class="badge bg-secondary rounded-pill">Público</span>
        </div>
        <div id="toast-container"></div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card-profile">
        <h6 class="text-uppercase small fw-bold mb-4" style="letter-spacing: 2px;">Mis Publicaciones</h6>
        <div id="feedUsuario">
            <div class="text-center p-5 text-muted small">Cargando actividad...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold">Actualizar Datos</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formPerfil">
          <div class="mb-3">
            <label class="form-label small">Nombre Completo</label>
            <input type="text" id="editNombre" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label small">Biografía / Descripción</label>
            <textarea id="editBio" class="form-control" rows="3"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label small">Privacidad de cuenta</label>
            <select id="editPrivacidad" class="form-control">
                <option value="publico">Público</option>
                <option value="privado">Privado</option>
            </select>
          </div>
          <div class="text-end mt-4">
            <button type="button" class="btn btn-link text-white text-decoration-none me-3" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-warning fw-bold px-4">Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  (function() {
    let sesion = JSON.parse(localStorage.getItem("sesion"));
    const AVATAR_BUCKET = 'multimedia'; // Ajustar según tu bucket de Supabase

    if (!sesion) { window.location.href = "index.html"; return; }

    async function init() {
        renderPerfil();
        cargarMisPosts();
        
        // Pre-llenar modal
        document.getElementById("editNombre").value = sesion.nombre;
        document.getElementById("editBio").value = sesion.bio || "";
        document.getElementById("editPrivacidad").value = sesion.privacidad || "publico";
    }

    function renderPerfil() {
        document.getElementById("perfil-nombre").innerText = sesion.nombre;
        document.getElementById("perfil-correo").innerText = sesion.email;
        document.getElementById("perfil-bio").innerText = sesion.bio || "Agrega una biografía para que otros te conozcan.";
        document.getElementById("perfil-privacidad").innerText = (sesion.privacidad || 'publico').toUpperCase();
        
        const fotoURL = sesion.foto_perfil || `https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=c8a951&color=000&size=150`;
        document.getElementById("avatar-grande").src = fotoURL;
    }

    async function cargarMisPosts() {
        const { data: posts, error } = await window.supabaseClient
            .from('publicaciones')
            .select('*')
            .eq('autor_id', sesion.id)
            .order('creado_a_las', { ascending: false });

        const feed = document.getElementById("feedUsuario");
        document.getElementById("count-posts").innerText = posts?.length || 0;

        if (error || !posts.length) {
            feed.innerHTML = `<div class="text-center p-4 text-muted small">No has publicado nada todavía.</div>`;
            return;
        }

        feed.innerHTML = posts.map(p => `
            <div class="post-card">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <small class="text-gold fw-bold" style="font-size: 10px;">${new Date(p.creado_a_las).toLocaleDateString()}</small>
                    <button class="btn btn-sm text-danger p-0 border-0" onclick="borrarPost(${p.id})"><i class="bi bi-trash"></i></button>
                </div>
                <p class="small mb-0">${p.contenido_texto || ''}</p>
                ${p.archivo_url ? `<img src="${p.archivo_url}" class="img-fluid rounded mt-2 shadow-sm">` : ''}
            </div>
        `).join('');
    }

    // --- LOGICA DE ACTUALIZACIÓN (De editperfil.html y perfil.html) ---
    document.getElementById("formPerfil").onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;

        const upData = {
            nombre: document.getElementById("editNombre").value,
            bio: document.getElementById("editBio").value,
            privacidad: document.getElementById("editPrivacidad").value
        };

        const { error } = await window.supabaseClient
            .from('usuarios')
            .update(upData)
            .eq('id', sesion.id);

        if (!error) {
            // Actualizar local y UI
            sesion = { ...sesion, ...upData };
            localStorage.setItem("sesion", JSON.stringify(sesion));
            renderPerfil();
            bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        }
        btn.disabled = false;
    };

    // --- SUBIDA DE FOTO (De perfil1.html) ---
    document.getElementById("upload-photo").onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;

        try {
            const ext = file.name.split('.').pop();
            const path = `avatars/${sesion.id}_${Date.now()}.${ext}`;
            
            const { data, error } = await window.supabaseClient.storage
                .from(AVATAR_BUCKET)
                .upload(path, file);

            if (error) throw error;

            const { data: urlData } = window.supabaseClient.storage
                .from(AVATAR_BUCKET).getPublicUrl(data.path);

            const fotoURL = urlData.publicUrl;

            // Guardar en DB
            await window.supabaseClient.from('usuarios').update({ foto_perfil: fotoURL }).eq('id', sesion.id);

            sesion.foto_perfil = fotoURL;
            localStorage.setItem("sesion", JSON.stringify(sesion));
            document.getElementById("avatar-grande").src = fotoURL;
        } catch (err) {
            alert("Error al subir foto: " + err.message);
        }
    };

    window.borrarPost = async (id) => {
        if (!confirm("¿Eliminar publicación?")) return;
        await window.supabaseClient.from('publicaciones').delete().eq('id', id);
        cargarMisPosts();
    };

    window.logout = () => {
        localStorage.removeItem("sesion");
        window.location.href = "index.html";
    };

    init();
  })();
</script>
</body>
</html>
