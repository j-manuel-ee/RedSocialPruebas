<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — Red UNAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS (Conservados idénticos) ── */
    :root { --bg:#0a0c10; --surface:#111318; --surface2:#181c24; --border:rgba(255,255,255,0.07); --accent:#002f6c; --gold:#c8a951; --gold-glow:rgba(200,169,81,0.18); --text:#e8eaf0; --muted:#6b7280; --danger:#e05252; --success:#34d399; --radius:14px; --card-shadow:0 2px 24px rgba(0,0,0,0.45); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,47,108,0.35) 0%, transparent 70%); }
    
    .header-main { position: sticky; top: 0; z-index: 100; background: rgba(10,12,16,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 28px; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-mark { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), #0047ab); border-radius: 8px; display: grid; place-items: center; font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--gold); box-shadow: 0 0 18px rgba(0,47,108,0.6); }
    .logo-text { font-size: 15px; font-weight: 700; background: linear-gradient(90deg, #fff 60%, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .page-wrap { max-width: 680px; margin: 0 auto; padding: 32px 16px 80px; }
    .profile-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; box-shadow: var(--card-shadow); }
    .hero-banner { height: 110px; background: linear-gradient(135deg, var(--accent) 0%, #0a1a3a 50%, #1a0a00 100%); }
    .hero-body { padding: 0 24px 24px; }
    .avatar-wrap { position: relative; display: inline-block; margin-top: -44px; margin-bottom: 12px; }
    .avatar-lg { width: 88px; height: 88px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; display: block; }
    .avatar-upload-btn { position: absolute; bottom: 2px; right: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--gold); cursor: pointer; font-size: 13px; display: grid; place-items: center; }
    
    .profile-name { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 4px; }
    .profile-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .profile-bio { font-size: 13px; color: #b0b5c0; line-height: 1.6; }
    
    .stats-row { display: flex; gap: 28px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .stat { text-align: center; }
    .stat-num { font-size: 18px; font-weight: 700; color: var(--gold); font-family: 'DM Serif Display', serif; }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
    
    .profile-actions { display: flex; gap: 10px; margin-top: 16px; }
    .btn-action { padding: 8px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text); }
    .btn-danger-outline { border-color: rgba(224,82,82,0.3); color: var(--danger); background: none; }
    
    /* Grids y Cards */
    .side-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 600px) { .side-grid { grid-template-columns: 1fr; } }
    .side-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
    .side-card-title { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    
    .detail-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 11px; font-size: 13px; color: #c9cdd8; }
    .detail-label { font-size: 10px; color: var(--muted); }
    .detail-value { font-weight: 600; color: var(--text); }
    
    /* Sesiones */
    .sesion-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .sesion-info { flex: 1; }
    .sesion-nombre { font-size: 12px; font-weight: 600; }
    .sesion-meta { font-size: 11px; color: var(--muted); }
    .btn-close-sesion { background: none; border: 1px solid rgba(224,82,82,0.3); border-radius: 6px; padding: 3px 8px; font-size: 10px; color: var(--danger); cursor: pointer; }
    
    .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
    .post-img img { max-width: 100%; border-radius: 10px; margin-top: 10px; }
  </style>
</head>
<body>

<header class="header-main">
  <div class="top-bar">
    <a class="logo" href="inicioRed.html">
      <div class="logo-mark">U</div>
      <span class="logo-text">Red UNAM</span>
    </a>
  </div>
</header>

<div class="page-wrap">
  <div class="profile-hero">
    <div class="hero-banner"></div>
    <div class="hero-body">
      <div class="avatar-wrap">
        <img class="avatar-lg" id="avatar-grande" src="" alt="foto">
        <label class="avatar-upload-btn" id="label-avatar-upload" for="avatar-file-input" style="display:none;">📷</label>
        <input type="file" id="avatar-file-input" accept="image/*" hidden>
      </div>
      <div class="profile-name" id="display-nombre">Cargando...</div>
      <div class="profile-meta" id="display-email">...</div>
      <div class="profile-bio" id="display-bio">...</div>

      <div class="stats-row">
        <div class="stat"><div class="stat-num" id="stat-posts">0</div><div class="stat-label">Publicaciones</div></div>
      </div>

      <div class="profile-actions" id="mis-controles-perfil" style="display:none;">
        <button class="btn-action">✏️ Editar perfil</button>
        <button class="btn-action btn-danger-outline" onclick="logout()">↪ Cerrar sesión</button>
      </div>
    </div>
  </div>

  <div class="side-grid">
    <div class="side-card">
      <div class="side-card-title">Detalles académicos</div>
      <div class="detail-row">
        <div><div class="detail-label">Institución</div><div class="detail-value" id="det-institucion">—</div></div>
      </div>
      <div class="detail-row" id="fila-privada-cuenta" style="display:none;">
        <div><div class="detail-label">Núm. de cuenta</div><div class="detail-value" id="det-cuenta">—</div></div>
      </div>
    </div>

    <div class="side-card" id="card-sesiones" style="display:none;">
      <div class="side-card-title">Sesiones activas</div>
      <div id="sesiones-lista"><div class="text-muted small text-center">Cargando...</div></div>
    </div>
  </div>

  <div style="color:var(--muted); font-size:11px; font-weight:bold; margin-bottom:15px; text-transform:uppercase;">Publicaciones</div>
  <div id="mis-posts"><div class="text-center text-muted small">Cargando publicaciones...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script>
(async function () {
  // --- VERIFICAR SESIÓN Y PARÁMETROS URL ---
  const sesionData = localStorage.getItem('sesion');
  if (!sesionData) { window.location.replace('index.html'); return; }
  const miSesion = JSON.parse(sesionData);
  
  const urlParams = new URLSearchParams(window.location.search);
  const idPerfilEnVista = urlParams.get('id') || miSesion.id;
  const esMiPerfil = (idPerfilEnVista === miSesion.id);

  // --- OBTENER DATOS DEL USUARIO A MOSTRAR ---
  let datosPerfil = miSesion; // Por defecto asumimos que soy yo
  if (!esMiPerfil) {
      const { data, error } = await window.supabaseClient.from('usuarios').select('*').eq('id', idPerfilEnVista).single();
      if (error) { alert("Usuario no encontrado"); window.location.href="inicioRed.html"; return; }
      datosPerfil = data;
  }

  // --- RENDERIZAR UI ---
  const avatar = datosPerfil.foto_perfil || `https://ui-avatars.com/api/?name=${encodeURIComponent(datosPerfil.nombre)}&background=002f6c&color=c8a951&bold=true`;
  document.getElementById('avatar-grande').src = avatar;
  document.getElementById('display-nombre').textContent = datosPerfil.nombre;
  document.getElementById('display-email').textContent = datosPerfil.email;
  document.getElementById('display-bio').textContent = datosPerfil.descripcion || 'Sin biografía.';
  
  // Institución
  let inst = 'Comunidad UNAM';
  if(datosPerfil.email?.includes('aragon')) inst = 'FES Aragón';
  document.getElementById('det-institucion').textContent = inst;

  // Si es mi perfil, mostrar configuraciones privadas
  if (esMiPerfil) {
      document.getElementById('mis-controles-perfil').style.display = 'flex';
      document.getElementById('card-sesiones').style.display = 'block';
      document.getElementById('label-avatar-upload').style.display = 'grid';
      document.getElementById('fila-privada-cuenta').style.display = 'flex';
      document.getElementById('det-cuenta').textContent = miSesion.numero_cuenta || '—';
      cargarMisSesiones();
  }

  // --- CARGAR POSTS DEL USUARIO ---
  const { data: posts } = await window.supabaseClient.from('publicaciones')
      .select('*').eq('autor_id', idPerfilEnVista).order('creado_a_las', { ascending: false });
  
  document.getElementById('stat-posts').textContent = posts ? posts.length : 0;
  
  const postCont = document.getElementById('mis-posts');
  if(!posts || posts.length === 0) {
      postCont.innerHTML = '<div class="text-center text-muted small p-4">No hay publicaciones.</div>';
  } else {
      postCont.innerHTML = posts.map(p => `
        <div class="post-card">
          <strong>${p.autor_nombre}</strong>
          <p style="margin-top:8px; font-size:14px;">${p.contenido_texto || ''}</p>
          ${p.archivo_url ? `<div class="post-img"><img src="${p.archivo_url}"></div>` : ''}
        </div>
      `).join('');
  }

  // --- MANEJO CORRECTO DE SESIONES (USANDO TOKEN_REF) ---
  async function cargarMisSesiones() {
      const { data } = await window.supabaseClient.from('usuarios').select('sesiones_activas').eq('id', miSesion.id).single();
      let sesiones = data?.sesiones_activas || [];
      
      const lista = document.getElementById('sesiones-lista');
      if(sesiones.length === 0) { lista.innerHTML = "Sin registros"; return; }

      lista.innerHTML = sesiones.map((s, idx) => {
          const esActual = idx === 0; // Asumimos que la 0 es la actual por cómo las insertas en index.html
          return `
          <div class="sesion-item" id="ses-box-${s.token_ref}">
              <div class="sesion-info">
                  <div class="sesion-nombre">${s.dispositivo} · ${s.navegador} ${esActual ? '<span class="text-success small">● Actual</span>' : ''}</div>
                  <div class="sesion-meta">${new Date(s.fecha).toLocaleString()}</div>
              </div>
              ${!esActual ? `<button class="btn-close-sesion" onclick="cerrarSesionLocal('${s.token_ref}')">Cerrar</button>` : ''}
          </div>`;
      }).join('');
  }

  window.cerrarSesionLocal = async function(tokenRefABorrar) {
      try {
          const { data } = await window.supabaseClient.from('usuarios').select('sesiones_activas').eq('id', miSesion.id).single();
          let sesionesDB = data?.sesiones_activas || [];
          
          // FILTRAMOS POR TOKEN_REF, NO POR ÍNDICE (Esto evita el bug que mencionaste)
          const sesionesActualizadas = sesionesDB.filter(s => s.token_ref !== tokenRefABorrar);

          await window.supabaseClient.from('usuarios').update({ sesiones_activas: sesionesActualizadas }).eq('id', miSesion.id);
          document.getElementById(`ses-box-${tokenRefABorrar}`).remove();
      } catch(e) { alert("Error al cerrar: " + e.message); }
  }

  window.logout = () => { localStorage.removeItem('sesion'); location.replace('index.html'); };
})();
</script>
</body>
</html>
