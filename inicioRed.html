<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM - Comunidad Universitaria</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #181c24;
      --border: rgba(255,255,255,0.07);
      --accent: #002f6c;
      --gold: #c8a951;
      --text: #e8eaf0;
      --muted: #6b7280;
      --danger: #e05252;
      --radius: 14px;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0,47,108,0.35) 0%, transparent 70%);
      min-height: 100vh;
    }

    /* --- NAVIGATION --- */
    .header-main {
      position: sticky;
      top: 0;
      z-index: 1050;
      background: rgba(10,12,16,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .logo-mark {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), #0047ab);
      border-radius: 8px;
      display: grid; place-items: center;
      font-family: 'DM Serif Display', serif;
      color: var(--gold);
      box-shadow: 0 0 18px rgba(0,47,108,0.6);
      text-decoration: none;
    }

    .search-container {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      max-width: 320px;
      transition: 0.2s;
    }
    .search-container:focus-within { border-color: var(--gold); }
    
    .search-results {
      position: absolute; top: 110%; left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 1000;
      max-height: 300px;
      overflow-y: auto;
    }

    /* --- LAYOUT --- */
    .sticky-sidebar { position: sticky; top: 90px; height: calc(100vh - 110px); overflow-y: auto; }
    .sticky-sidebar::-webkit-scrollbar { display: none; }

    /* --- CARDS & POSTS --- */
    .custom-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    .post-media { width: 100%; border-radius: 10px; margin-top: 12px; border: 1px solid var(--border); }
    
    .btn-interaction {
      background: none; border: none; color: var(--muted);
      font-size: 0.9rem; transition: 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-interaction:hover { color: var(--gold); }
    .btn-interaction.active { color: var(--danger); }

    .nav-link-custom {
      color: var(--muted); font-weight: 600; font-size: 14px;
      transition: 0.2s; border-bottom: 2px solid transparent;
    }
    .nav-link-custom:hover, .nav-link-custom.active { color: var(--gold); border-bottom-color: var(--gold); }

    .official-badge {
      background: var(--gold); color: #000;
      border-radius: 50%; padding: 2px; font-size: 8px; margin-left: 5px;
    }

    .comment-box { background: var(--surface2); border-radius: 8px; padding: 10px; margin-top: 10px; }
  </style>
</head>
  <!-- MODAL EDITAR POST -->
<div
class="modal fade"
id="editPostModal"
tabindex="-1"
>

<div class="modal-dialog modal-dialog-centered">

<div
class="modal-content"
style="
background: var(--surface);
border:1px solid var(--border);
border-radius:18px;
"
>

<div class="modal-header border-secondary">

<h5 class="modal-title text-white">
Editar publicación
</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal"
></button>

</div>

<div class="modal-body">

<textarea
id="editPostText"
class="form-control bg-dark border-0 text-white mb-3"
rows="4"
style="resize:none;border-radius:12px;"
></textarea>

<div id="editPreview"></div>

<input
type="file"
id="editFile"
hidden
accept="image/*,video/*"
>

<div class="d-flex gap-2 mt-3">

<label
for="editFile"
class="btn btn-outline-light btn-sm"
>
Cambiar archivo
</label>

<button
id="btnRemoveCurrentMedia"
class="btn btn-outline-danger btn-sm"
>
Quitar archivo
</button>

</div>

</div>

<div class="modal-footer border-secondary">

<button
class="btn btn-secondary"
data-bs-dismiss="modal"
>
Cancelar
</button>

<button
id="btnSaveEdit"
class="btn btn-warning fw-bold"
>
Guardar cambios
</button>

</div>

</div>

</div>

</div>
<body>

<header class="header-main">
  <div class="container-fluid px-lg-5">
    <div class="d-flex align-items-center justify-content-between py-2">
      <a href="inicioRed.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <div class="logo-mark">U</div>
        <span class="fw-bold d-none d-sm-inline" style="letter-spacing: 1px; color: var(--text)">RED UNAM</span>
      </a>

      <div class="position-relative flex-grow-1 mx-4" style="max-width: 400px;">
        <div class="search-container d-flex align-items-center">
          <i class="bi bi-search text-muted me-2"></i>
          <input type="text" id="inputBusqueda" class="form-control bg-transparent border-0 text-white p-0 shadow-none" placeholder="Buscar compañeros..." style="font-size: 14px;">
        </div>
        <div id="resultadosBusqueda" class="search-results shadow-lg"></div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <div class="dropdown">
          <a href="notificaciones.html" class="text-white position-relative fs-5" data-bs-toggle="dropdown">
            <i class="bi bi-bell"></i>
            <span id="badge-notificaciones" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 10px;">0</span>
          </a>
          <ul id="lista-notificaciones" class="dropdown-menu dropdown-menu-end shadow-lg p-2 mt-3" style="width: 300px; background: var(--surface2); border: 1px solid var(--border);">
            <li class="text-center small text-muted p-3">Cargando...</li>
          </ul>
        </div>

        <div id="authArea"></div>
      </div>
    </div>
    
    <nav class="d-flex gap-4 pb-1">
      <a href="#" class="nav-link-custom active py-2">Inicio</a>
      <a href="amigos.html" class="nav-link-custom py-2">Explorar</a>
      <a href="#" id="btnFacultad" class="nav-link-custom py-2 text-warning">🎓 Mi Facultad</a>
    </nav>
  </div>
</header>

<main class="container-fluid px-lg-5 mt-4">
  <div class="row">
    <div class="col-lg-3 d-none d-lg-block">
      <div class="sticky-sidebar">
        <h6 class="text-muted text-uppercase fw-bold mb-4 small" style="letter-spacing: 1px;">Sugerencias UNAM</h6>
        <div id="listaSugerencias">
            <div class="text-center p-3 small text-muted">Buscando comunidad...</div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="custom-card">
        <h3 class="font-serif mb-3" style="font-family: 'DM Serif Display', serif; font-size: 1.2rem;">¿Qué quieres <span style="color: var(--gold);">compartir</span>?</h3>
        <textarea id="postContent" class="form-control bg-dark border-0 text-white mb-3" rows="3" placeholder="Escribe algo para la comunidad..." style="border-radius: 12px; resize: none;"></textarea>
        
        <div id="filePreview" class="mb-3 text-center"></div>

        <div class="d-flex justify-content-between align-items-center">
          <label for="postFile" class="btn btn-sm btn-outline-secondary border-0" style="cursor:pointer">
            <i class="bi bi-camera-fill me-1"></i> Foto/Video
            <input type="file" id="postFile" hidden accept="image/*,video/*">
          </label>
          <button id="btnPublicar" class="btn btn-primary px-4 fw-bold" style="background: linear-gradient(135deg, var(--accent), #0047ab); border: none; border-radius: 8px;">
            Publicar
          </button>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3 my-4">
        <hr class="flex-grow-1 opacity-10">
        <span class="text-muted small fw-bold text-uppercase" style="letter-spacing: 2px; font-size: 10px;">Recientes</span>
        <hr class="flex-grow-1 opacity-10">
      </div>

      <div id="feedPublicaciones">
        <div class="text-center p-5"><div class="spinner-border text-gold" style="color: var(--gold);"></div></div>
      </div>
    </div>

    <div class="col-lg-3 d-none d-lg-block">
        <div class="sticky-sidebar">
          <div class="custom-card text-center">
            <h6 class="text-muted small fw-bold mb-3">MENSAJES DIRECTOS</h6>
            <i class="bi bi-chat-heart text-gold mb-2 d-block" style="font-size: 2rem; color: var(--gold);"></i>
            <p class="small text-muted">Próximamente: Chat Universitario en tiempo real.</p>
          </div>
          <div id="climaOInfo" class="mt-3 p-2 small text-muted text-center">
            © 2026 Red UNAM - Hecho con ❤️ por Ingeniería
          </div>
        </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

(function() {

const sesion = JSON.parse(localStorage.getItem("sesion"));
const BUCKET = 'publicaciones-media';

function validarSesion() {

const sesionGuardada = localStorage.getItem("sesion");

if (!sesionGuardada) {
window.location.replace("index.html");
return false;
}

return true;
}

if (!validarSesion()) return;

// ─────────────────────────────────────────────────────────────
// UTILIDADES
// ─────────────────────────────────────────────────────────────

const getInst = (email) => {

if (email?.endsWith('@aragon.unam.mx')) return "FES Aragón";
if (email?.endsWith('@ingenieria.unam.mx')) return "Facultad de Ingeniería";

return "Comunidad UNAM";
};

function getProfilePhoto(user = sesion) {

return user.foto_perfil ||
`https://ui-avatars.com/api/?name=${encodeURIComponent(user.nombre)}&background=c8a951&color=000&bold=true`;

}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────

async function init() {

renderUserHeader();

await cargarPublicaciones();

cargarNotificaciones();

cargarSugerencias();

setupSearch();

}

init();

// ─────────────────────────────────────────────────────────────
// HEADER
// ─────────────────────────────────────────────────────────────

function renderUserHeader() {

const avatar = getProfilePhoto();

document.getElementById("authArea").innerHTML = `
<div class="dropdown">

<div class="d-flex align-items-center gap-2 cursor-pointer"
data-bs-toggle="dropdown">

<span class="small fw-bold d-none d-md-block">
${sesion.nombre.split(' ')[0]}
</span>

<img
src="${avatar}"
class="rounded-circle border border-warning"
width="36"
height="36"
style="object-fit:cover;"
>

</div>

<ul class="dropdown-menu dropdown-menu-end shadow-lg mt-2"
style="background: var(--surface2); border: 1px solid var(--border);">

<li class="p-3 text-center">

<img
src="${avatar}"
class="rounded-circle mb-2"
width="55"
height="55"
style="object-fit:cover;"
>

<div class="fw-bold text-white small">
${sesion.nombre}
</div>

<div class="text-gold"
style="font-size: 10px; color: var(--gold)">
${getInst(sesion.email)}
</div>

</li>

<li><hr class="dropdown-divider opacity-10"></li>

<li>
<a class="dropdown-item small" href="perfil.html">
Ver Perfil
</a>
</li>

<li>
<button
class="dropdown-item small text-danger"
onclick="logout()"
>
Cerrar Sesión
</button>
</li>

</ul>

</div>`;
}

// ─────────────────────────────────────────────────────────────
// PREVIEW
// ─────────────────────────────────────────────────────────────

const postFile = document.getElementById("postFile");
const filePreview = document.getElementById("filePreview");

const removeBtn = document.createElement("button");

removeBtn.className =
"btn btn-sm btn-outline-danger mt-2 d-none";

removeBtn.innerText = "Eliminar archivo";

filePreview.after(removeBtn);

postFile.addEventListener("change", () => {

const file = postFile.files[0];

if (!file) return;

const url = URL.createObjectURL(file);

if (file.type.startsWith("video")) {

filePreview.innerHTML = `
<video
src="${url}"
controls
class="post-media"
style="max-height:500px;object-fit:contain;background:black;"
></video>
`;

} else {

filePreview.innerHTML = `
<img
src="${url}"
class="post-media"
style="max-height:500px;object-fit:contain;background:black;"
>
`;
}

removeBtn.classList.remove("d-none");

});

removeBtn.onclick = () => {

postFile.value = "";

filePreview.innerHTML = "";

removeBtn.classList.add("d-none");

};

// ─────────────────────────────────────────────────────────────
// PUBLICAR
// ─────────────────────────────────────────────────────────────

document.getElementById("btnPublicar").onclick = async () => {

const btn = document.getElementById("btnPublicar");

const txt =
document.getElementById("postContent").value.trim();

const file = postFile.files[0];

if (!txt && !file) return;

btn.disabled = true;
btn.innerText = "Publicando...";

try {

let url = null;
let type = null;

if (file) {

const path =
`posts/${Date.now()}_${file.name}`;

const { error: uploadError } =
await window.supabaseClient.storage
.from(BUCKET)
.upload(path, file);

if (uploadError) throw uploadError;

url = window.supabaseClient.storage
.from(BUCKET)
.getPublicUrl(path).data.publicUrl;

type = file.type;
}

const { error } =
await window.supabaseClient
.from('publicaciones')
.insert([{

autor_id: sesion.id,

autor_nombre: sesion.nombre,

autor_foto: sesion.foto_perfil || null,

contenido_texto: txt,

archivo_url: url,

tipo_archivo: type

}]);

if (error) throw error;

document.getElementById("postContent").value = "";

postFile.value = "";

filePreview.innerHTML = "";

removeBtn.classList.add("d-none");

await cargarPublicaciones();

} catch(err) {

alert(err.message);

} finally {

btn.disabled = false;

btn.innerText = "Publicar";
}
};

// ─────────────────────────────────────────────────────────────
// CARGAR POSTS
// ─────────────────────────────────────────────────────────────

async function cargarPublicaciones() {

const feed =
document.getElementById("feedPublicaciones");

feed.innerHTML = `
<div class="text-center p-5">
<div class="spinner-border"
style="color:var(--gold)">
</div>
</div>`;

const { data: posts, error } =
await window.supabaseClient
.from('publicaciones')
.select('*')
.order('creado_a_las', { ascending: false });

if (error) {

feed.innerHTML = `
<div class="text-center p-4 text-danger">
Error cargando publicaciones
</div>`;

return;
}

feed.innerHTML = "";

if (!posts.length) {

feed.innerHTML = `
<div class="text-center p-5 text-muted">
No hay publicaciones
</div>`;

return;
}

posts.forEach(p => {

const esMio = p.autor_id === sesion.id;

const fecha =
new Date(p.creado_a_las).toLocaleString();

let media = "";

if (p.archivo_url) {

if (p.tipo_archivo?.startsWith("video")) {

media = `
<video
src="${p.archivo_url}"
controls
class="post-media"
style="
max-height:650px;
object-fit:contain;
background:black;
"
></video>
`;

} else {

media = `
<img
src="${p.archivo_url}"
class="post-media"
style="
max-height:650px;
object-fit:contain;
background:black;
"
>
`;
}
}

const div = document.createElement("div");

div.className = "custom-card";

div.id = `post-${p.id}`;

div.innerHTML = `

<div class="d-flex justify-content-between align-items-center mb-3">

<div
class="d-flex align-items-center gap-2"
style="cursor:pointer"
onclick="location.href='perfil.html?id=${p.autor_id}'"
>

<img
src="${p.autor_foto || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.autor_nombre)}&background=random`}"
class="rounded-circle"
width="38"
height="38"
style="object-fit:cover;"
>

<div>

<h6 class="mb-0 fw-bold small">
${p.autor_nombre}
</h6>

<small class="text-muted" style="font-size:10px;">
${fecha}
</small>

</div>

</div>

${esMio ? `

<div class="d-flex gap-2">

<button
class="btn btn-sm btn-warning"
onclick="editarPost(${p.id})"
>
<i class="bi bi-pencil"></i>
</button>

<button
class="btn btn-sm btn-danger"
onclick="eliminarPost(${p.id})"
>
<i class="bi bi-trash"></i>
</button>

</div>

` : ''}

</div>

<p style="line-height:1.6;">
${p.contenido_texto || ''}
</p>

${media}
`;

feed.appendChild(div);

});

}

// ─────────────────────────────────────────────────────────────
// EDITAR POST
// ─────────────────────────────────────────────────────────────

let editingPost = null;

let nuevaImagenEditar = null;

let eliminarMediaActual = false;

window.editarPost = async (postId) => {

const { data: post } =
await window.supabaseClient
.from("publicaciones")
.select("*")
.eq("id", postId)
.single();

if (!post) return;

editingPost = post;

nuevaImagenEditar = null;

eliminarMediaActual = false;

document.getElementById("editPostText").value =
post.contenido_texto || "";

renderEditPreview(post.archivo_url, post.tipo_archivo);

const modal =
new bootstrap.Modal(
document.getElementById("editPostModal")
);

modal.show();

};
  function renderEditPreview(url, tipo) {

const preview =
document.getElementById("editPreview");

if (!url) {

preview.innerHTML = `
<div class="text-muted small text-center py-4">
Sin archivo
</div>
`;

return;
}

if (tipo?.startsWith("video")) {

preview.innerHTML = `
<video
src="${url}"
controls
class="post-media"
style="
max-height:400px;
object-fit:contain;
background:black;
"
></video>
`;

} else {

preview.innerHTML = `
<img
src="${url}"
class="post-media"
style="
max-height:400px;
object-fit:contain;
background:black;
"
>
`;
}

}
  document.getElementById("editFile")
.addEventListener("change", (e) => {

const file = e.target.files[0];

if (!file) return;

nuevaImagenEditar = file;

const url = URL.createObjectURL(file);

renderEditPreview(url, file.type);

});
  document.getElementById("btnRemoveCurrentMedia")
.onclick = () => {

eliminarMediaActual = true;

nuevaImagenEditar = null;

document.getElementById("editFile").value = "";

renderEditPreview(null, null);

};
  document.getElementById("btnSaveEdit")
.onclick = async () => {

if (!editingPost) return;

const btn =
document.getElementById("btnSaveEdit");

btn.disabled = true;

btn.innerText = "Guardando...";

try {

let archivo_url = editingPost.archivo_url;

let tipo_archivo = editingPost.tipo_archivo;

// eliminar media anterior

if (eliminarMediaActual && archivo_url) {

const path =
archivo_url.split(`/storage/v1/object/public/${BUCKET}/`)[1];

if (path) {

await window.supabaseClient.storage
.from(BUCKET)
.remove([path]);

}

archivo_url = null;

tipo_archivo = null;
}

// subir nueva

if (nuevaImagenEditar) {

const path =
`posts/${Date.now()}_${nuevaImagenEditar.name}`;

await window.supabaseClient.storage
.from(BUCKET)
.upload(path, nuevaImagenEditar);

archivo_url =
window.supabaseClient.storage
.from(BUCKET)
.getPublicUrl(path).data.publicUrl;

tipo_archivo =
nuevaImagenEditar.type;
}

await window.supabaseClient
.from("publicaciones")
.update({

contenido_texto:
document.getElementById("editPostText").value,

archivo_url,

tipo_archivo

})
.eq("id", editingPost.id)
.eq("autor_id", sesion.id);

bootstrap.Modal
.getInstance(
document.getElementById("editPostModal")
)
.hide();

editingPost = null;

await cargarPublicaciones();

} catch(err) {

alert(err.message);

} finally {

btn.disabled = false;

btn.innerText = "Guardar cambios";

}

};
  

// ─────────────────────────────────────────────────────────────
// ELIMINAR
// ─────────────────────────────────────────────────────────────

window.eliminarPost = async (postId) => {

if (!confirm("¿Eliminar publicación?")) return;

const { data: post } =
await window.supabaseClient
.from("publicaciones")
.select("archivo_url")
.eq("id", postId)
.single();

if (post?.archivo_url) {

const path =
post.archivo_url
.split(`/storage/v1/object/public/${BUCKET}/`)[1];

if (path) {

await window.supabaseClient.storage
.from(BUCKET)
.remove([path]);

}
}

await window.supabaseClient
.from("publicaciones")
.delete()
.eq("id", postId)
.eq("autor_id", sesion.id);

document.getElementById(`post-${postId}`)?.remove();

};

// ─────────────────────────────────────────────────────────────
// LOGOUT
// ─────────────────────────────────────────────────────────────

window.logout = () => {

localStorage.removeItem("sesion");

window.location.href = "index.html";

};

// ─────────────────────────────────────────────────────────────
// NOTIFICACIONES
// ─────────────────────────────────────────────────────────────

async function cargarNotificaciones() {

const { data: notifs } =
await window.supabaseClient
.from('notificaciones')
.select('*')
.eq('usuario_id', sesion.id)
.order('creado_a_las', { ascending: false })
.limit(8);

const badge =
document.getElementById("badge-notificaciones");

const lista =
document.getElementById("lista-notificaciones");

const unread =
notifs?.filter(n => !n.leida).length || 0;

badge.innerText = unread;

unread > 0
? badge.classList.remove("d-none")
: badge.classList.add("d-none");

lista.innerHTML = notifs?.length ?

notifs.map(n => `
<li class="p-2 small border-bottom border-secondary">
<b>${n.emisor_nombre}</b> ${n.tipo}
</li>
`).join('')

:

'<li class="text-center p-3 small">Sin novedades</li>';

}

// SUGERENCIAS
// ─────────────────────────────────────────────────────────────

async function cargarSugerencias() {

const { data: users } =
await window.supabaseClient
.from('usuarios')
.select('id, nombre, email')
.neq('id', sesion.id)
.limit(5);

document.getElementById("listaSugerencias").innerHTML =
users.map(u => `

<div class="d-flex align-items-center justify-content-between mb-3">

<div class="d-flex align-items-center gap-2">

<img
src="https://ui-avatars.com/api/?name=${encodeURIComponent(u.nombre)}&background=random"
class="rounded-circle"
width="32"
height="32"
>

<div>

<div class="fw-bold" style="font-size: 12px;">
${u.nombre}
</div>

<div class="text-muted" style="font-size: 9px;">
${getInst(u.email)}
</div>

</div>

</div>

<button
class="btn btn-sm text-gold fw-bold p-0"
style="font-size:11px;"
>
Seguir
</button>

</div>

`).join('');

}

// ─────────────────────────────────────────────────────────────
// BUSCADOR
// ─────────────────────────────────────────────────────────────

function setupSearch() {

document.getElementById('inputBusqueda').oninput =
async (e) => {

const q = e.target.value.trim();

const res =
document.getElementById('resultadosBusqueda');

if (q.length < 2) {

res.innerHTML = "";

return;
}

const { data } =
await window.supabaseClient
.from('usuarios')
.select('id,nombre')
.ilike('nombre', `%${q}%`)
.limit(5);

res.innerHTML = data.map(u => `

<div
class="p-2 border-bottom border-secondary text-white small"
style="cursor:pointer;"
onclick="location.href='perfil.html?id=${u.id}'"
>
${u.nombre}
</div>

`).join('');

};

}

})();

</script>
