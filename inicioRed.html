<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red UNAM - Inicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background-color: #121212; }
    .nav-link#facultadNav { color: #ffc107 !important; font-weight: bold; }
    .auth-vacia { visibility: hidden; }
    .sticky-col { position: sticky; top: 80px; height: calc(100vh - 100px); overflow-y: auto; }
    .card-social { border-radius: 12px; border: none; background-color: #1e1e1e; margin-bottom: 20px; }
    .user-status { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background-color: #28a745; margin-right: 8px; }
    .sticky-col::-webkit-scrollbar { display: none; }
    .search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #252525; z-index: 1050; border-radius: 0 0 10px 10px;
      max-height: 250px; overflow-y: auto; border: 1px solid #333;
    }
    .post-media { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 400px; object-fit: cover; }
    .btn-interaction { color: #aaa; transition: 0.3s; font-size: 0.9rem; border: none; background: transparent; }
    .btn-interaction:hover { color: #0d6efd; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="inicioRed.html">
      <img src="images/logoUNAM.png" width="40" class="me-2">
      <strong class="d-none d-sm-block">Red UNAM</strong>
    </a>

    <div class="flex-grow-1 mx-3 position-relative" style="max-width: 400px;">
      <div class="input-group input-group-sm">
        <span class="input-group-text bg-dark border-0 text-white"><i class="bi bi-search"></i></span>
        <input type="text" id="inputBusqueda" class="form-control bg-dark border-0 text-white" placeholder="Buscar en la UNAM...">
      </div>
      <div id="resultadosBusqueda" class="search-results shadow"></div>
    </div>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto align-items-center">
        <li class="nav-item"><a class="nav-link active" href="inicioRed.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="amigos.html"><i class="bi bi-people-fill"></i></a></li>
        <li class="nav-item dropdown">
          <a class="nav-link position-relative" href="notificaciones.html" id="notifDrop" data-bs-toggle="dropdown">
            <i class="bi bi-bell-fill"></i>
            <span id="badge-notificaciones" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
          </a>
          <ul id="lista-notificaciones" class="dropdown-menu dropdown-menu-end shadow p-2" style="width: 280px; max-height: 400px; overflow-y: auto;">
            <li class="text-center small text-muted">Cargando...</li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link auth-vacia" href="facultad.html" id="facultadNav"></a></li>
      </ul>
      <div id="authArea" class="auth-vacia"></div>
    </div>
  </div>
</nav>

<div class="container-fluid mt-4 px-lg-5">
  <div class="row">
    <div class="col-lg-3 d-none d-lg-block">
      <div class="sticky-col">
        <h6 class="text-muted text-uppercase fw-bold mb-3 small">Sugerencias UNAM</h6>
        <div id="listaContactos" class="list-group list-group-flush shadow-sm rounded">
          <div class="text-center p-3 small text-muted">Buscando compañeros...</div>
        </div>
      </div>
    </div>

    <div class="col-lg-6 col-md-12">
      <div class="card card-social shadow-sm p-3 mb-4">
        <div class="d-flex">
          <img id="userImgPost" src="" class="rounded-circle me-2" width="40">
          <button class="btn btn-dark w-100 text-start text-muted rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#modalPost">
            ¿Qué quieres compartir hoy, <span id="userNameShort"></span>?
          </button>
        </div>
      </div>
      <div id="feedPublicaciones">
        <div class="text-center p-5"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>

    <div class="col-lg-3 d-none d-lg-block">
      <div class="sticky-col">
        <h6 class="text-muted text-uppercase fw-bold mb-3 small">Mensajes Directos</h6>
        <div class="card card-social border-0 shadow-sm p-3 text-center">
             <p class="small text-muted">Próximamente: Chat Universitario</p>
             <i class="bi bi-chat-dots text-primary fs-2"></i>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalPost" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark border-secondary text-white">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Nueva publicación</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <textarea id="postContent" class="form-control bg-transparent text-white border-0 mb-3" rows="4" placeholder="¿Qué está pasando en tu facultad?"></textarea>
        <div class="d-flex align-items-center justify-content-between p-2 border border-secondary rounded">
          <small class="text-muted">Añadir multimedia:</small>
          <label for="postFile" class="btn btn-outline-primary btn-sm"><i class="bi bi-camera-fill"></i> Foto/Video</label>
          <input type="file" id="postFile" hidden accept="image/*,video/*">
        </div>
        <div id="filePreview" class="mt-2 text-center small text-info"></div>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-primary w-100 fw-bold" id="btnPublicar">Publicar en Red UNAM</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  (function() {
    const sesion = JSON.parse(localStorage.getItem("sesion"));

    // --- 🛠 LÓGICA DE INSTITUCIÓN ---
    function obtenerInstitucion(email) {
        if (!email) return "Comunidad UNAM";
        if (email.endsWith('@aragon.unam.mx')) return "FES Aragón";
        if (email.endsWith('@ingenieria.unam.mx')) return "Facultad de Ingeniería";
        if (email.endsWith('@comunidad.unam.mx')) return "UNAM Central";
        return "Comunidad UNAM";
    }

    // --- 🌍 FUNCIONES GLOBALES ---
    window.marcarLeidas = async () => {
        await window.supabaseClient.from('notificaciones').update({ leida: true }).eq('usuario_id', sesion.id);
        cargarNotificaciones();
    };

    window.gestionarLike = async (postId, currentLikes, autorId) => {
        const { data: existe } = await window.supabaseClient.from('likes_usuarios').select('id').eq('user_id', sesion.id).eq('post_id', postId).maybeSingle();
        if (existe) {
            await window.supabaseClient.from('likes_usuarios').delete().eq('id', existe.id);
            await window.supabaseClient.from('publicaciones').update({ likes_count: Math.max(0, currentLikes - 1) }).eq('id', postId);
        } else {
            await window.supabaseClient.from('likes_usuarios').insert([{ user_id: sesion.id, post_id: postId }]);
            await window.supabaseClient.from('publicaciones').update({ likes_count: currentLikes + 1 }).eq('id', postId);
            if(autorId !== sesion.id) await window.supabaseClient.from('notificaciones').insert([{ usuario_id: autorId, emisor_nombre: sesion.nombre, tipo: "le dio me gusta a tu post", leida: false }]);
        }
        cargarPublicaciones();
    };

    window.enviarComentario = async (postId, autorId) => {
        const input = document.getElementById(`input-comentario-${postId}`);
        const texto = input.value.trim();
        if (!texto) return;
        await window.supabaseClient.from('comentarios').insert([{ publicacion_id: postId, autor_id: sesion.id, autor_comentario_nombre: sesion.nombre, contenido_comentario: texto }]);
        if(autorId !== sesion.id) await window.supabaseClient.from('notificaciones').insert([{ usuario_id: autorId, emisor_nombre: sesion.nombre, tipo: "comentó tu post", leida: false }]);
        input.value = "";
        cargarPublicaciones();
    };

    // --- 📦 CARGA DE DATOS ---
    async function cargarNotificaciones() {
        const { data: notifs } = await window.supabaseClient.from('notificaciones').select('*').eq('usuario_id', sesion.id).order('creado_a_las', { ascending: false }).limit(10);
        const badge = document.getElementById("badge-notificaciones");
        const lista = document.getElementById("lista-notificaciones");
        const noLeidas = notifs?.filter(n => !n.leida).length || 0;
        badge.innerText = noLeidas;
        noLeidas > 0 ? badge.classList.remove("d-none") : badge.classList.add("d-none");
        lista.innerHTML = notifs?.length ? notifs.map(n => `<li class="p-2 border-bottom border-secondary small ${n.leida ? '' : 'bg-dark'}"><b>${n.emisor_nombre}</b> ${n.tipo}</li>`).join('') + `<li><button class="btn btn-link btn-sm w-100" onclick="marcarLeidas()">Marcar todo como leído</button></li>` : '<li class="text-center p-2 small">Sin notificaciones</li>';
    }

    async function cargarPublicaciones() {
        const { data: posts } = await window.supabaseClient.from('publicaciones').select('*, comentarios(*)').order('creado_a_las', { ascending: false });
        const feed = document.getElementById("feedPublicaciones");
        feed.innerHTML = posts.map(p => {
            let media = p.archivo_url ? (p.tipo_archivo?.includes('video') ? `<video src="${p.archivo_url}" controls class="post-media"></video>` : `<img src="${p.archivo_url}" class="post-media">`) : "";
            const coms = (p.comentarios || []).map(c => `<div class="p-2 mb-1 bg-dark rounded small"><b class="text-info">${c.autor_comentario_nombre}:</b> ${c.contenido_comentario}</div>`).join('');
            return `
                <div class="card card-social p-3">
                    <div class="d-flex align-items-center mb-3 cursor-pointer" onclick="location.href='perfil.html?id=${p.autor_id}'">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(p.autor_nombre)}&background=random" class="rounded-circle me-2" width="40">
                        <div>
                            <h6 class="mb-0 fw-bold text-white">${p.autor_nombre}</h6>
                            <small class="text-muted small">${new Date(p.creado_a_las).toLocaleString()}</small>
                        </div>
                    </div>
                    <p class="text-white mb-2">${p.contenido_texto}</p>
                    ${media}
                    <div class="d-flex mt-3 border-top border-secondary pt-2">
                        <button class="btn-interaction me-3" onclick="gestionarLike(${p.id}, ${p.likes_count || 0}, '${p.autor_id}')"><i class="bi bi-heart-fill text-danger"></i> ${p.likes_count || 0}</button>
                        <button class="btn-interaction" onclick="document.getElementById('caja-${p.id}').classList.toggle('d-none')"><i class="bi bi-chat"></i> Comentar</button>
                    </div>
                    <div id="caja-${p.id}" class="mt-3 d-none">
                        <div class="mb-2">${coms}</div>
                        <div class="input-group input-group-sm">
                            <input type="text" id="input-comentario-${p.id}" class="form-control bg-dark text-white border-secondary" placeholder="Escribe un comentario...">
                            <button class="btn btn-primary" onclick="enviarComentario(${p.id}, '${p.autor_id}')">Publicar</button>
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    async function cargarSugerencias() {
        const { data: users } = await window.supabaseClient.from('usuarios').select('id, nombre, email').neq('id', sesion.id).limit(6);
        const lista = document.getElementById("listaContactos");
        lista.innerHTML = users.map(u => `
            <div class="list-group-item bg-transparent border-0 d-flex align-items-center px-0 mb-3">
                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(u.nombre)}&background=random" class="rounded-circle me-2" width="35" onclick="location.href='perfil.html?id=${u.id}'" style="cursor:pointer">
                <div>
                    <span class="d-block small fw-bold text-white">${u.nombre}</span>
                    <small class="text-muted d-block" style="font-size: 0.65rem;">${obtenerInstitucion(u.email)}</small>
                    <button class="btn text-primary p-0 small" style="font-size: 0.7rem;" onclick="window.supabaseClient.from('notificaciones').insert([{usuario_id:'${u.id}', emisor_nombre:'${sesion.nombre}', tipo:'te envió una solicitud', leida:false}]); alert('Solicitud enviada');">Agregar</button>
                </div>
            </div>`).join('');
    }

    // --- 🚀 INICIALIZACIÓN ---
    function cargarInterfaz() {
      if (!sesion) { window.location.replace("index.html"); return; }
      
      const miInst = obtenerInstitucion(sesion.email);
      const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=0D6EFD&color=fff`;
      
      document.getElementById("userImgPost").src = avatar;
      document.getElementById("userNameShort").innerText = sesion.nombre.split(' ')[0];
      
      // Navbar Facultad
      const fNav = document.getElementById("facultadNav");
      fNav.innerHTML = `🎓 ${miInst}`;
      fNav.classList.remove("auth-vacia");

      // Dropdown Usuario
      const authArea = document.getElementById("authArea");
      authArea.innerHTML = `
        <div class="dropdown">
          <button class="btn btn-light btn-sm dropdown-toggle fw-bold" data-bs-toggle="dropdown">
            ${sesion.nombre.split(' ')[0]}
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow p-3">
            <li class="text-center mb-2">
              <img src="${avatar}" class="rounded-circle mb-2" width="55">
              <div class="fw-bold text-primary small">${sesion.nombre}</div>
              <div class="text-muted" style="font-size: 0.7rem;">${miInst}</div>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-center fw-bold border rounded mb-2" href="perfil.html">Ver Perfil</a></li>
            <li><button class="dropdown-item text-danger text-center fw-bold" onclick="localStorage.removeItem('sesion'); location.href='index.html'">Cerrar sesión</button></li>
          </ul>
        </div>`;
      authArea.classList.remove("auth-vacia");

      // Buscador
      document.getElementById('inputBusqueda').addEventListener('input', async (e) => {
          const q = e.target.value.trim();
          const res = document.getElementById('resultadosBusqueda');
          if (q.length < 2) { res.innerHTML = ""; return; }
          const { data } = await window.supabaseClient.from('usuarios').select('id, nombre').ilike('nombre', `%${q}%`).limit(5);
          res.innerHTML = data.map(u => `<div class="p-2 border-bottom border-secondary text-white small cursor-pointer" onclick="location.href='perfil.html?id=${u.id}'">${u.nombre}</div>`).join('');
      });

      cargarPublicaciones();
      cargarNotificaciones();
      cargarSugerencias();
    }

    document.getElementById("btnPublicar").onclick = async () => {
        const txt = document.getElementById("postContent").value;
        const file = document.getElementById("postFile").files[0];
        if (!txt.trim() && !file) return;
        document.getElementById("btnPublicar").disabled = true;
        let url = null, type = null;
        if (file) {
            const path = `posts/${Date.now()}_${file.name}`;
            await window.supabaseClient.storage.from('multimedia').upload(path, file);
            url = window.supabaseClient.storage.from('multimedia').getPublicUrl(path).data.publicUrl;
            type = file.type;
        }
        await window.supabaseClient.from('publicaciones').insert([{ autor_id: sesion.id, autor_nombre: sesion.nombre, contenido_texto: txt, archivo_url: url, tipo_archivo: type }]);
        location.reload();
    };

    cargarInterfaz();
  })();
</script>
</body>
</html>
