<main class="container-fluid px-lg-5 mt-4">

        <button onclick="filtrarRapido('semana')" class="btn btn-sm btn-outline-secondary text-white border-opacity-10 py-2" style="font-size: 11px; background: rgba(255,255,255,0.02)">Esta semana</button>
        <button onclick="filtrarRapido('mes')" class="btn btn-sm btn-outline-secondary text-white border-opacity-10 py-2" style="font-size: 11px; background: rgba(255,255,255,0.02)">Este mes</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="js/buscador.js"></script>
<script src="js/seguir.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

(function() {
    // 1. SESIÓN GLOBAL ÚNICA
    const sesion = JSON.parse(localStorage.getItem("sesion"));
    if (!sesion) {
        window.location.replace("index.html");
        return;
    }
    window.sesion = sesion; 
    const BUCKET = 'publicaciones-media';

function validarSesion() {

const sesionGuardada = localStorage.getItem("sesion");

if (!sesionGuardada) {
window.location.replace("index.html");
return false;
}

return true;
}

if (!validarSesion()) return;

// ─────────────────────────────────────────────────────────────
// UTILIDADES
// ─────────────────────────────────────────────────────────────

const getInst = (email) => {

if (email?.endsWith('@aragon.unam.mx')) return "FES Aragón";
if (email?.endsWith('@ingenieria.unam.mx')) return "Facultad de Ingeniería";

return "Comunidad UNAM";
};

function getProfilePhoto(user = sesion) {

return user.foto_perfil ||
`https://ui-avatars.com/api/?name=${encodeURIComponent(user.nombre)}&background=c8a951&color=000&bold=true`;

}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────

// Este es el ÚNICO init que debe existir (línea 134 aprox)
async function init() {
  if (typeof FollowModule !== 'undefined') FollowModule.inyectarModal();
  renderUserHeader();
  await cargarPublicaciones(); // Esto es lo que trae los posts y comentarios
  cargarNotificaciones();
  cargarSugerencias();

  // Esta protección es clave para que no truene tu página
  if (typeof setupSearch === 'function') {
    setupSearch();
  } else {
    console.warn("Buscador no disponible aún.");
  }
}

// Se llama una sola vez
init();

// ─────────────────────────────────────────────────────────────
// HEADER
// ─────────────────────────────────────────────────────────────

function renderUserHeader() {

const avatar = getProfilePhoto();

document.getElementById("authArea").innerHTML = `
<div class="dropdown">

<div class="d-flex align-items-center gap-2 cursor-pointer"
data-bs-toggle="dropdown">

<span class="small fw-bold d-none d-md-block">
${sesion.nombre.split(' ')[0]}
</span>

<img
src="${avatar}"
class="rounded-circle border border-warning"
width="36"
height="36"
style="object-fit:cover;"
>

</div>

<ul class="dropdown-menu dropdown-menu-end shadow-lg mt-2"
style="background: var(--surface2); border: 1px solid var(--border);">

<li class="p-3 text-center">

<img
src="${avatar}"
class="rounded-circle mb-2"
width="55"
height="55"
style="object-fit:cover;"
>

<div class="fw-bold text-white small">
${sesion.nombre}
</div>

<div class="text-gold"
style="font-size: 10px; color: var(--gold)">
${getInst(sesion.email)}
</div>

</li>

<li><hr class="dropdown-divider opacity-10"></li>

<li>
<a class="dropdown-item small" href="perfil.html?id=${sesion.id}">
Ver Perfil
</a>
</li>

<li>
<button
class="dropdown-item small text-danger"
onclick="logout()"
>
Cerrar Sesión
</button>
</li>

</ul>

</div>`;
}

// ─────────────────────────────────────────────────────────────
// PREVIEW
// ─────────────────────────────────────────────────────────────

const postFile = document.getElementById("postFile");
const filePreview = document.getElementById("filePreview");

const removeBtn = document.createElement("button");

removeBtn.className =
"btn btn-sm btn-outline-danger mt-2 d-none";

removeBtn.innerText = "Eliminar archivo";

filePreview.after(removeBtn);

postFile.addEventListener("change", () => {

const file = postFile.files[0];

if (!file) return;

const url = URL.createObjectURL(file);

if (file.type.startsWith("video")) {

filePreview.innerHTML = `
<video
src="${url}"
controls
class="post-media"
style="max-height:500px;object-fit:contain;background:black;"
></video>
`;

} else {

filePreview.innerHTML = `
<img
src="${url}"
class="post-media"
style="max-height:500px;object-fit:contain;background:black;"
>
`;
}

removeBtn.classList.remove("d-none");

});

removeBtn.onclick = () => {

postFile.value = "";

filePreview.innerHTML = "";

removeBtn.classList.add("d-none");

};

 // ─────────────────────────────────────────────────────────────
// ACCIONES
// ─────────────────────────────────────────────────────────────
  window.marcarLeidas = async () => {
    await window.supabaseClient.from('notificaciones').update({ leida: true }).eq('usuario_id', sesion.id);
    cargarNotificaciones();
  };

  window.gestionarLike = async (postId, currentLikes, autorId) => {
    const { data: existe } = await window.supabaseClient.from('likes_usuarios').select('id').eq('user_id', sesion.id).eq('post_id', postId).maybeSingle();
    if (existe) {
      await window.supabaseClient.from('likes_usuarios').delete().eq('id', existe.id);
      await window.supabaseClient.from('publicaciones').update({ likes_count: Math.max(0, currentLikes - 1) }).eq('id', postId);
    } else {
      await window.supabaseClient.from('likes_usuarios').insert([{ user_id: sesion.id, post_id: postId }]);
      await window.supabaseClient.from('publicaciones').update({ likes_count: currentLikes + 1 }).eq('id', postId);
      if(autorId !== sesion.id) {
        await window.supabaseClient.from('notificaciones').insert([{ usuario_id: autorId, emisor_nombre: sesion.nombre, tipo: "le dio me gusta a tu post", leida: false }]);
      }
    }
    cargarPublicaciones();
  };

  window.enviarComentario = async (postId, autorId) => {
    const input = document.getElementById(`input-comentario-${postId}`);
    const texto = input.value.trim();
    if (!texto) return;
    await window.supabaseClient.from('comentarios').insert([{ publicacion_id: postId, autor_id: sesion.id, autor_comentario_nombre: sesion.nombre, contenido_comentario: texto }]);
    if(autorId !== sesion.id) {
      await window.supabaseClient.from('notificaciones').insert([{ usuario_id: autorId, emisor_nombre: sesion.nombre, tipo: "comentó tu post", leida: false }]);
    }
    input.value = "";
    cargarPublicaciones();
  };

  // Asegúrate de que esto esté dentro del script pero accesible
    window.eliminarComentario = async (comentarioId) => {
    const sesion = JSON.parse(localStorage.getItem("sesion"));

    if (!sesion) return;
    if (!confirm("¿Eliminar comentario?")) return;

    try {
        const { error } = await window.supabaseClient
            .from("comentarios")
            .delete()
            .eq("id", comentarioId)
            .eq("autor_id", sesion.id);

        if (error) {
            console.error(error);
            alert("Error al borrar: " + error.message);
            return;
        }

        await cargarPublicaciones();

    } catch (err) {
        console.error(err);
        alert("No se pudo eliminar el comentario");
    }
};

window.editarPost = async (postId, textoActual) => {
    const nuevoTexto = prompt("Editar publicación:", textoActual);

    if (nuevoTexto === null) return; // canceló
    if (!nuevoTexto.trim()) return alert("El texto no puede quedar vacío");

    try {
        const sesion = JSON.parse(localStorage.getItem("sesion"));

        const { error } = await window.supabaseClient
            .from("publicaciones")
            .update({
                contenido_texto: nuevoTexto.trim()
            })
            .eq("id", postId)
            .eq("autor_id", sesion.id);

        if (error) {
            console.error(error);
            alert("No se pudo editar");
            return;
        }

        await cargarPublicaciones();

    } catch (err) {
        console.error(err);
        alert("Error al editar");
    }
};

// ─────────────────────────────────────────────────────────────
// PUBLICAR
// ─────────────────────────────────────────────────────────────

document.getElementById("btnPublicar").onclick = async () => {

const btn = document.getElementById("btnPublicar");

const txt =
document.getElementById("postContent").value.trim();

const file = postFile.files[0];

if (!txt && !file) return;

btn.disabled = true;
btn.innerText = "Publicando...";

try {

let url = null;
let type = null;

if (file) {

const path =
`posts/${Date.now()}_${file.name}`;

const { error: uploadError } =
await window.supabaseClient.storage
.from(BUCKET)
.upload(path, file);

if (uploadError) throw uploadError;

url = window.supabaseClient.storage
.from(BUCKET)
.getPublicUrl(path).data.publicUrl;

type = file.type;
}

const { error } =
await window.supabaseClient
.from('publicaciones')
.insert([{

autor_id: sesion.id,

autor_nombre: sesion.nombre,

autor_foto: sesion.foto_perfil || null,

contenido_texto: txt,

archivo_url: url,

tipo_archivo: type

}]);

if (error) throw error;

document.getElementById("postContent").value = "";

postFile.value = "";

filePreview.innerHTML = "";

removeBtn.classList.add("d-none");

await cargarPublicaciones();

} catch(err) {

alert(err.message);

} finally {

btn.disabled = false;

btn.innerText = "Publicar";
}
};

// ─────────────────────────────────────────────────────────────
// CARGAR POSTS
// ─────────────────────────────────────────────────────────────

async function cargarPublicaciones(fechaInicio = null) {
  const feed = document.getElementById("feedPublicaciones");
  feed.innerHTML = `<div class="text-center p-5"><div class="spinner-border" style="color:var(--gold)"></div></div>`;

  let query = window.supabaseClient
    .from('publicaciones')
    .select('*, likes_usuarios(user_id), comentarios(*)') 
    .order('creado_a_las', { ascending: false });

  if (fechaInicio) {
    query = query.gte('creado_a_las', `${fechaInicio}T00:00:00Z`);
  }

  const { data: posts, error } = await query;

  if (error) {
    feed.innerHTML = `<div class="text-center p-4 text-danger">Error cargando publicaciones</div>`;
    return;
  }

  feed.innerHTML = "";
  
  posts.forEach(p => {
    // 1. DEFINICIÓN DE VARIABLES DE ESTADO (Mantenlas aquí arriba)
    const esMio = p.autor_id === window.sesion.id;
    const userHasLiked = p.likes_usuarios?.some(like => like.user_id === window.sesion.id) || false;
    const likesCount = p.likes_count || 0;

    // 2. GENERAR HTML DE COMENTARIOS
    const htmlComentarios = p.comentarios?.map(com => {
  const soyAutorComentario = com.autor_id === sesion.id;

  return `
    <div class="d-flex justify-content-between align-items-center mb-2 p-2 rounded border-0" 
         style="background-color: rgba(255,255,255,0.05) !important; color: #eee !important;">

      <div style="font-size: 11px;">
        <span class="fw-bold text-warning">${com.autor_comentario_nombre}:</span> 
        <span>${com.contenido_comentario}</span>
      </div>

      ${soyAutorComentario ? `
        <button
          class="btn btn-sm btn-danger"
          onclick="eliminarComentario(${com.id})"
          <i class="bi bi-trash"></i>
        </button>
      ` : ''}

    </div>
  `;
}).join('') || '<p class="text-muted small text-center my-2" style="font-size: 10px;">Sin comentarios</p>';

    // 3. GENERAR MEDIA (Imagen/Video)
    let mediaHTML = "";
    if (p.archivo_url) {
      const isVideo = p.tipo_archivo?.startsWith("video");
      mediaHTML = isVideo 
        ? `<video src="${p.archivo_url}" controls class="post-media w-100 rounded-3" style="max-height:450px; background:black;"></video>`
        : `<img src="${p.archivo_url}" class="post-media w-100 rounded-3" style="max-height:450px; object-fit:contain; background:black;">`;
    }

    // 4. CONSTRUIR EL POST
    const div = document.createElement("div");
    div.className = "custom-card mb-4";
    div.id = `post-${p.id}`; // Agregamos ID para manipulación directa si es necesario
    div.innerHTML = `
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
          <img src="${p.autor_foto || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.autor_nombre)}&background=random`}" class="rounded-circle" width="35" height="35" style="object-fit:cover;">
          <div>
            <h6 class="mb-0 fw-bold small">${p.autor_nombre}</h6>
            <small class="text-muted" style="font-size:9px;">${new Date(p.creado_a_las).toLocaleString()}</small>
          </div>
        </div>
        ${esMio ? `

            <div class="d-flex gap-2">

            <button
            class="btn btn-sm btn-warning"
            onclick="editarPost(${p.id})"
            >
            <i class="bi bi-pencil"></i>
            </button>

            <button
            class="btn btn-sm btn-danger"
            onclick="eliminarPost(${p.id})"
            >
            <i class="bi bi-trash"></i>
            </button>

            </div>

            ` : ''}
            </div>
      
      <p class="small mb-3">${p.contenido_texto || ''}</p>
      ${mediaHTML}

      <div class="mt-3">
        <button onclick="gestionarLike(${p.id}, ${likesCount}, '${p.autor_id}')" 
                class="btn btn-sm ${userHasLiked ? 'text-warning' : 'text-white'} p-0 d-flex align-items-center gap-1 shadow-none">
          <i class="bi ${userHasLiked ? 'bi-heart-fill' : 'bi-heart'}"></i>
          <span class="small">${likesCount}</span>
        </button>
      </div>

      <div class="mt-3 p-2 rounded" style="background: rgba(0,0,0,0.2);">
        <div id="lista-comentarios-${p.id}">
          ${htmlComentarios}
        </div>
        <div class="input-group input-group-sm mt-2">
          <input type="text" id="input-comentario-${p.id}" class="form-control bg-dark border-0 text-white" placeholder="Comentar..." style="font-size: 10px;">
          <button onclick="enviarComentario(${p.id}, '${p.autor_id}')" class="btn btn-warning border-0"><i class="bi bi-send-fill"></i></button>
        </div>
      </div>
    `;
    feed.appendChild(div);
  });
}

// ─────────────────────────────────────────────────────────────
// EDITAR POST
// ─────────────────────────────────────────────────────────────

let editingPost = null;

let nuevaImagenEditar = null;

let eliminarMediaActual = false;

window.editarPost = async (postId) => {

const { data: post } =
await window.supabaseClient
.from("publicaciones")
.select("*")
.eq("id", postId)
.single();

if (!post) return;

editingPost = post;

nuevaImagenEditar = null;

eliminarMediaActual = false;

document.getElementById("editPostText").value =
post.contenido_texto || "";

renderEditPreview(post.archivo_url, post.tipo_archivo);

const modal =
new bootstrap.Modal(
document.getElementById("editPostModal")
);

modal.show();

};
  function renderEditPreview(url, tipo) {

const preview =
document.getElementById("editPreview");

if (!url) {

preview.innerHTML = `
<div class="text-muted small text-center py-4">
Sin archivo
</div>
`;

return;
}

if (tipo?.startsWith("video")) {

preview.innerHTML = `
<video
src="${url}"
controls
class="post-media"
style="
max-height:400px;
object-fit:contain;
background:black;
"
></video>
`;

} else {

preview.innerHTML = `
<img
src="${url}"
class="post-media"
style="
max-height:400px;
object-fit:contain;
background:black;
"
>
`;
}

}
  document.getElementById("editFile")
.addEventListener("change", (e) => {

const file = e.target.files[0];

if (!file) return;

nuevaImagenEditar = file;

const url = URL.createObjectURL(file);

renderEditPreview(url, file.type);

});
  document.getElementById("btnRemoveCurrentMedia")
.onclick = () => {

eliminarMediaActual = true;

nuevaImagenEditar = null;

document.getElementById("editFile").value = "";

renderEditPreview(null, null);

};
  document.getElementById("btnSaveEdit")
.onclick = async () => {

if (!editingPost) return;

const btn =
document.getElementById("btnSaveEdit");

btn.disabled = true;

btn.innerText = "Guardando...";

try {

let archivo_url = editingPost.archivo_url;

let tipo_archivo = editingPost.tipo_archivo;

// eliminar media anterior

if (eliminarMediaActual && archivo_url) {

const path =
archivo_url.split(`/storage/v1/object/public/${BUCKET}/`)[1];

if (path) {

await window.supabaseClient.storage
.from(BUCKET)
.remove([path]);

}

archivo_url = null;

tipo_archivo = null;
}

// subir nueva

if (nuevaImagenEditar) {

const path =
`posts/${Date.now()}_${nuevaImagenEditar.name}`;

await window.supabaseClient.storage
.from(BUCKET)
.upload(path, nuevaImagenEditar);

archivo_url =
window.supabaseClient.storage
.from(BUCKET)
.getPublicUrl(path).data.publicUrl;

tipo_archivo =
nuevaImagenEditar.type;
}

await window.supabaseClient
.from("publicaciones")
.update({

contenido_texto:
document.getElementById("editPostText").value,

archivo_url,

tipo_archivo

})
.eq("id", editingPost.id)
.eq("autor_id", sesion.id);

bootstrap.Modal
.getInstance(
document.getElementById("editPostModal")
)
.hide();

editingPost = null;

await cargarPublicaciones();

} catch(err) {

alert(err.message);

} finally {

btn.disabled = false;

btn.innerText = "Guardar cambios";

}

};
  

// ─────────────────────────────────────────────────────────────
// ELIMINAR
// ─────────────────────────────────────────────────────────────

window.eliminarPost = async (postId) => {
    if (!confirm("¿Eliminar publicación?")) return;

    try {
        const { error } = await window.supabaseClient
            .from("publicaciones")
            .delete()
            .eq("id", postId)
            .eq("autor_id", sesion.id);

        if (error) throw error;

        await cargarPublicaciones();

    } catch (err) {
        console.error(err);
        alert("No se pudo eliminar la publicación");
    }
};

// ─────────────────────────────────────────────────────────────
// LOGOUT
// ─────────────────────────────────────────────────────────────

window.logout = () => {

localStorage.removeItem("sesion");

window.location.href = "index.html";

};

// ─────────────────────────────────────────────────────────────
// NOTIFICACIONES
// ─────────────────────────────────────────────────────────────

async function cargarNotificaciones() {

const { data: notifs } =
await window.supabaseClient
.from('notificaciones')
.select('*')
.eq('usuario_id', sesion.id)
.order('creado_a_las', { ascending: false })
.limit(8);

const badge =
document.getElementById("badge-notificaciones");

const lista =
document.getElementById("lista-notificaciones");

const unread =
notifs?.filter(n => !n.leida).length || 0;

badge.innerText = unread;

unread > 0
? badge.classList.remove("d-none")
: badge.classList.add("d-none");

lista.innerHTML = notifs?.length ?

notifs.map(n => `
<li class="p-2 small border-bottom border-secondary">
<b>${n.emisor_nombre}</b> ${n.tipo}
</li>
`).join('')

:

'<li class="text-center p-3 small">Sin novedades</li>';

}

// ─────────────────────────────────────────────────────────────
// SUGERENCIAS
// ─────────────────────────────────────────────────────────────

async function cargarSugerencias() {

try {

const { data: users } =
await window.supabaseClient
.from('usuarios')
.select('id, nombre, email, foto_perfil')
.neq('id', sesion.id)
.limit(5);

if (!users || users.length === 0) {
  document.getElementById("listaSugerencias").innerHTML = '<p class="text-muted small text-center">Sin sugerencias</p>';
  return;
}

// Intentar obtener a quiénes ya sigo (la tabla puede no existir aún)
let yaSigo = new Set();
try {
  const { data: siguiendo } = await window.supabaseClient
    .from('seguidores')
    .select('seguido_id')
    .eq('seguidor_id', sesion.id);
  yaSigo = new Set((siguiendo || []).map(r => r.seguido_id));
} catch (_) { /* tabla seguidores aún no existe, ignorar */ }

document.getElementById("listaSugerencias").innerHTML =
users.map(u => {
  const avatar = u.foto_perfil
    || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.nombre)}&background=random`;
  const esSiguiendo = yaSigo.has(u.id);
  return `
<div class="d-flex align-items-center justify-content-between mb-3">

<div class="d-flex align-items-center gap-2" style="cursor:pointer" onclick="location.href='perfil.html?id=${u.id}'">

<img
src="${avatar}"
class="rounded-circle"
width="32"
height="32"
style="object-fit:cover;"
>

<div>

<div class="fw-bold" style="font-size: 12px;">
${u.nombre}
</div>

<div class="text-muted" style="font-size: 9px;">
${getInst(u.email)}
</div>

</div>

</div>

<button
class="btn-follow-sm${esSiguiendo ? ' siguiendo' : ''}"
id="btn-sug-${u.id}"
onclick="toggleSugerencia('${u.id}', this)"
>
${esSiguiendo ? '✔ Siguiendo' : 'Seguir'}
</button>

</div>
`;
}).join('');

} catch(err) {
  console.error('Error en sugerencias:', err.message);
  const el = document.getElementById("listaSugerencias");
  if (el) el.innerHTML = '<p class="text-muted small text-center">No disponible</p>';
}

}

window.toggleSugerencia = async function(userId, btnEl) {
  if (typeof FollowModule !== 'undefined') {
    FollowModule.toggle(btnEl, sesion.id, userId);
  }
};

// FUNCIÓN DEL FILTRO DE FECHAS //
window.filtrarRapido = (periodo) => {
  const hoy = new Date();
  let fechaCalculada = null;

  if (periodo === 'hoy') {
    fechaCalculada = hoy.toISOString().split('T')[0];
  } 
  else if (periodo === 'semana') {
    const s = new Date();
    s.setDate(hoy.getDate() - 7);
    fechaCalculada = s.toISOString().split('T')[0];
  } 
  else if (periodo === 'mes') {
    const m = new Date();
    m.setDate(hoy.getDate() - 30);
    fechaCalculada = m.toISOString().split('T')[0];
  }

  // --- NUEVO: Cierra el menú automáticamente al hacer click ---
  const menu = document.getElementById('menuFiltro');
  if (menu) {
    const bsCollapse = bootstrap.Collapse.getInstance(menu) || new bootstrap.Collapse(menu, { toggle: false });
    bsCollapse.hide();
  }

  if (periodo === 'todos') {
    cargarPublicaciones(null);
  } else {
    cargarPublicaciones(fechaCalculada);
  }
}; 
  
})();

</script>
