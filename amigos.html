<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexiones — Red UNAM</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #181c24;
      --border: rgba(255,255,255,0.07);
      --accent: #002f6c;
      --gold: #c8a951;
      --text: #e8eaf0;
      --muted: #6b7280;
      --radius: 16px;
      --danger: #e05252;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      background-image: radial-gradient(circle at bottom left, rgba(0,47,108,0.1), transparent 40%);
      min-height: 100vh;
    }

    .nav-custom {
      background: rgba(10,12,16,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 1000;
    }

    .logo-mark {
      width: 32px; height: 32px;
      background: var(--gold); color: #000;
      border-radius: 8px; display: grid; place-items: center;
      font-weight: bold; text-decoration: none;
    }

    .custom-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    /* Tarjetas de Amigos */
    .friend-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.3s ease;
      text-align: center;
      height: 100%;
      cursor: pointer;
    }
    .friend-card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .img-friend {
      width: 85px; height: 85px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      margin-bottom: 12px;
    }

    /* Sugerencias lateral */
    .suggestion-item {
        background: rgba(255,255,255,0.02);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        transition: 0.2s;
        cursor: pointer;
    }
    .suggestion-item:hover { background: rgba(255,255,255,0.05); }

    .btn-gold-sm {
        background: var(--gold); color: black;
        font-size: 10px; font-weight: 800;
        border: none; border-radius: 6px;
        padding: 6px 12px;
    }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      margin-bottom: 25px;
    }

    .text-gold { color: var(--gold); }
  </style>
</head>
<body>

<nav class="nav-custom py-2 mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="inicioRed.html" class="d-flex align-items-center gap-2 text-decoration-none">
      <div class="logo-mark">U</div>
      <span class="fw-bold text-white small" style="letter-spacing: 1px;">RED UNAM</span>
    </a>
    <div id="authArea"></div>
  </div>
</nav>

<div class="container mb-5">
  <div class="row g-4">
    
    <div class="col-lg-8">
      
      <div id="seccionSolicitudes" class="d-none mb-5">
        <h5 class="section-title text-warning"><i class="bi bi-person-plus-fill"></i> Solicitudes de Amistad</h5>
        <div id="listaSolicitudes"></div>
      </div>

      <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h5 class="section-title mb-0">Mi Comunidad</h5>
            <p class="text-muted small mb-0">Personas con las que has conectado</p>
        </div>
        <span class="badge border border-secondary px-3 py-2" id="countFriends" style="font-weight: 400; font-size: 11px;">0 AMIGOS</span>
      </div>
      
      <div class="row g-3" id="gridAmigos">
        <div class="text-center py-5">
            <div class="spinner-border text-gold" style="color: var(--gold)"></div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="sticky-top" style="top: 100px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="text-muted text-uppercase fw-bold small mb-0" style="letter-spacing: 1px; font-size: 11px;">Sugerencias para ti</h6>
            <i class="bi bi-compass text-gold"></i>
        </div>
        <div class="custom-card">
          <div id="listaSugerencias">
            <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-gold"></div></div>
          </div>
        </div>
        <p class="text-muted" style="font-size: 10px; line-height: 1.5;">Explora perfiles de estudiantes de diversas facultades para ampliar tu red académica.</p>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/conexion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  (function() {
    const sesion = JSON.parse(localStorage.getItem("sesion"));
    if (!sesion) { window.location.replace("index.html"); return; }

    async function init() {
        renderAuth();
        await cargarSolicitudes();
        await cargarAmigos();
        await cargarSugerencias();
    }

    function renderAuth() {
        const avatar = sesion.foto_perfil || `https://ui-avatars.com/api/?name=${encodeURIComponent(sesion.nombre)}&background=c8a951&color=000&bold=true`;
        document.getElementById("authArea").innerHTML = `
            <a href="perfil.html"><img src="${avatar}" class="rounded-circle border border-secondary" width="38" height="38" style="object-fit: cover;"></a>`;
    }

    // CARGAR SOLICITUDES
    async function cargarSolicitudes() {
        const { data } = await window.supabaseClient.from('notificaciones')
            .select('*').eq('usuario_id', sesion.id).eq('tipo', 'te envió una solicitud de amistad').eq('leida', false);

        if (data?.length > 0) {
            document.getElementById("seccionSolicitudes").classList.remove("d-none");
            document.getElementById("listaSolicitudes").innerHTML = data.map(s => `
                <div class="custom-card d-flex justify-content-between align-items-center mb-2 py-3 shadow-sm border-warning">
                    <div class="d-flex align-items-center gap-3 cursor-pointer" onclick="location.href='perfil.html?id=${s.emisor_id}'">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(s.emisor_nombre)}&background=random" class="rounded-circle" width="40">
                        <span class="fw-bold text-white small">${s.emisor_nombre}</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-gold-sm" onclick="aceptarSolicitud(${s.id}, '${s.emisor_id}', '${s.emisor_nombre}')">ACEPTAR</button>
                        <button class="btn btn-sm btn-outline-secondary" style="font-size: 10px;" onclick="rechazarSolicitud(${s.id})">Ignorar</button>
                    </div>
                </div>`).join('');
        }
    }

    // CARGAR AMIGOS (GRID)
    async function cargarAmigos() {
        const { data } = await window.supabaseClient.from('amistades')
            .select('*').or(`usuario_id.eq.${sesion.id},amigo_id.eq.${sesion.id}`);

        const grid = document.getElementById("gridAmigos");
        document.getElementById("countFriends").innerText = `${data?.length || 0} AMIGOS`;

        if (!data?.length) {
            grid.innerHTML = '<div class="col-12 text-center py-5 text-muted small">No tienes conexiones todavía. ¡Usa las sugerencias!</div>';
            return;
        }

        const cards = await Promise.all(data.map(async rel => {
            const idAmigo = rel.usuario_id === sesion.id ? rel.amigo_id : rel.usuario_id;
            const { data: u } = await window.supabaseClient.from('usuarios').select('*').eq('id', idAmigo).single();
            if (!u) return '';
            
            const avatar = u.foto_perfil || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.nombre)}&background=random`;
            
            return `
                <div class="col-6 col-md-4">
                    <div class="friend-card" onclick="location.href='perfil.html?id=${u.id}'">
                        <img src="${avatar}" class="img-friend">
                        <h6 class="small fw-bold mb-1 text-white text-truncate">${u.nombre}</h6>
                        <p class="text-gold mb-3" style="font-size: 10px; opacity: 0.8;">Ver Perfil</p>
                        <button class="btn btn-sm btn-outline-danger-custom w-100 py-1" 
                                onclick="event.stopPropagation(); eliminarAmigo(${rel.id})" 
                                style="font-size: 9px; border: 1px solid rgba(224,82,82,0.2); color: #e05252; background: transparent; border-radius: 6px;">
                            ELIMINAR
                        </button>
                    </div>
                </div>`;
        }));
        grid.innerHTML = cards.join('');
    }

    // CARGAR SUGERENCIAS
    async function cargarSugerencias() {
        const { data: amistades } = await window.supabaseClient.from('amistades')
            .select('usuario_id, amigo_id').or(`usuario_id.eq.${sesion.id},amigo_id.eq.${sesion.id}`);
        
        const excluidos = [sesion.id];
        amistades?.forEach(r => excluidos.push(r.usuario_id === sesion.id ? r.amigo_id : r.usuario_id));

        const { data: usuarios } = await window.supabaseClient.from('usuarios')
            .select('*').not('id', 'in', `(${excluidos.join(',')})`).limit(8);

        const lista = document.getElementById("listaSugerencias");
        if (!usuarios?.length) {
            lista.innerHTML = '<p class="text-muted small text-center py-2">No hay nuevos perfiles sugeridos.</p>';
            return;
        }

        lista.innerHTML = usuarios.map(u => {
            const avatar = u.foto_perfil || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.nombre)}&background=c8a951&color=000&bold=true`;
            return `
                <div class="suggestion-item d-flex align-items-center justify-content-between" onclick="location.href='perfil.html?id=${u.id}'">
                    <div class="d-flex align-items-center gap-2 text-truncate">
                        <img src="${avatar}" class="rounded-circle border border-secondary" width="34" height="34" style="object-fit: cover;">
                        <div class="text-truncate">
                            <div class="fw-bold text-white" style="font-size: 12px;">${u.nombre}</div>
                            <div class="text-muted" style="font-size: 10px;">Estudiante UNAM</div>
                        </div>
                    </div>
                    <button class="btn btn-gold-sm" onclick="event.stopPropagation(); enviarSolicitud('${u.id}', '${u.nombre}')">CONECTAR</button>
                </div>`;
        }).join('');
    }

    // --- FUNCIONES DE ACCIÓN ---

    window.enviarSolicitud = async (id, nombre) => {
        await window.supabaseClient.from('notificaciones').insert([{
            usuario_id: id, emisor_id: sesion.id, emisor_nombre: sesion.nombre,
            tipo: "te envió una solicitud de amistad", leida: false
        }]);
        alert("¡Solicitud enviada!");
        cargarSugerencias();
    };

    window.aceptarSolicitud = async (notifId, emisorId, emisorNombre) => {
        await window.supabaseClient.from('amistades').insert([{ usuario_id: sesion.id, amigo_id: emisorId }]);
        await window.supabaseClient.from('notificaciones').update({ leida: true }).eq('id', notifId);
        location.reload();
    };

    window.rechazarSolicitud = async (notifId) => {
        await window.supabaseClient.from('notificaciones').delete().eq('id', notifId);
        location.reload();
    };

    window.eliminarAmigo = async (id) => {
        if (confirm("¿Seguro que quieres eliminar esta conexión?")) {
            await window.supabaseClient.from('amistades').delete().eq('id', id);
            location.reload();
        }
    };

    init();
  })();
</script>
</body>
</html>
