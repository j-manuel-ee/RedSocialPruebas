<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="../style/styles.css">
</head>
<body>

<!-- NAVBAR-->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container-fluid">

    <a class="navbar-brand d-flex align-items-center" href="../inicioRed.html">
      <img src="../images/logoUNAM.png" width="45" class="me-2">
      <strong>Red UNAM</strong>
    </a>

    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="../inicioRed.html">Inicio</a></li>
      </ul>

      <button class="btn btn-danger btn-sm" id="logoutBtn">Cerrar sesión</button>
    </div>

  </div>
</nav>

<!-- CONTENIDO -->
<div class="container d-flex justify-content-center align-items-center mt-5">

  <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%; border-radius: 20px;">

    <h3 class="text-center mb-4">Editar Perfil</h3>

    <form id="formPerfil">

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" id="correo" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Biografía</label>
        <textarea id="bio" class="form-control" rows="3"></textarea>
      </div>

      <hr>

      <!-- CONTRASEÑA -->
      <div class="mb-3">
        <label class="form-label">Nueva contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="Opcional">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>

    </form>

    <div id="mensaje" class="text-center mt-3 fw-bold"></div>

  </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function(){

  const sesionData = localStorage.getItem("sesion");

  if (!sesionData) {
    window.location.replace("../index.html");
    return;
  }

  const sesion = JSON.parse(sesionData);

  // 🔹 Cargar datos
  document.getElementById("nombre").value = sesion.nombre || "";
  document.getElementById("correo").value = sesion.email || "";
  document.getElementById("bio").value = sesion.bio || "";

  const form = document.getElementById("formPerfil");
  const mensaje = document.getElementById("mensaje");

  form.addEventListener("submit", function(e){
    e.preventDefault();

    const nombre = document.getElementById("nombre").value;
    const correo = document.getElementById("correo").value;
    const bio = document.getElementById("bio").value;
    const pass = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;

    // Validar contraseña
    if (pass && pass !== confirm) {
      mensaje.textContent = "Las contraseñas no coinciden";
      mensaje.style.color = "red";
      return;
    }

    // Actualizar sesión
    sesion.nombre = nombre;
    sesion.email = correo;
    sesion.bio = bio;

    if (pass) {
      sesion.password = pass;
    }

    localStorage.setItem("sesion", JSON.stringify(sesion));

    mensaje.textContent = "Perfil actualizado correctamente";
    mensaje.style.color = "lime";

    setTimeout(() => {
      window.location.href = "perfil.html";
    }, 1200);

  });

  // Logout
  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("sesion");
    window.location.replace("../index.html");
  });

})();
</script>

</body>
</html>
